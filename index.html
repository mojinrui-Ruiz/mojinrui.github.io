<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta property="og:title" content="莫晋睿 · 个人主页">
<meta property="og:description" content="产品经理 / 用户研究 / AI 产品：项目、实习经历和可以提问的 AI 分身">
<meta property="og:image" content="/media/memory-tree.jpg">
<title>莫晋睿 · 个人主页</title>
<meta name="description" content="莫晋睿的个人主页：产品方法、项目、实习经历和 AI 分身">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Caveat:wght@500;700&display=swap">
<style>
/* 个人主页：白板 / 亲和图的视觉语言。马克笔蓝写字，荧光笔只划真实数字 */
:root {
  --board: #eef1f4;
  --paper: #ffffff;
  --ink: #15213b;
  --graphite: #5a6577;
  --rule: #ccd3dc;
  --marker: #2448c9;
  --marker-soft: #dfe6fb;
  --hl: #ffe45c;
  --note: #fff7c2;
  --note-ink: #4a3d00;
  --latin: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
  --cn: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  --font: var(--latin), var(--cn);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --board: #0f1520; --paper: #172030; --ink: #e7ebf2; --graphite: #9aa5b6; --rule: #2b3648;
    --marker: #8aa6ff; --marker-soft: #1f2c4d; --hl: #8a7300; --note: #3a3418; --note-ink: #f3e7a6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --board: #0f1520; --paper: #172030; --ink: #e7ebf2; --graphite: #9aa5b6; --rule: #2b3648;
  --marker: #8aa6ff; --marker-soft: #1f2c4d; --hl: #8a7300; --note: #3a3418; --note-ink: #f3e7a6;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0; background: var(--board); color: var(--ink);
  font: 16px/1.7 var(--font); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  /* 白板上淡淡的点阵 */
  background-image: radial-gradient(color-mix(in srgb, var(--rule) 70%, transparent) 1px, transparent 1px);
  background-size: 22px 22px;
}
a { color: var(--marker); text-underline-offset: 3px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--marker); outline-offset: 3px; border-radius: 4px; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }
@media (max-width: 640px) { .wrap { padding: 0 16px; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* 荧光笔：只用在数字上 */
mark.hl {
  color: inherit; padding: 0 .12em; border-radius: 2px;
  background: linear-gradient(transparent 52%, var(--hl) 52%, var(--hl) 92%, transparent 92%) no-repeat 0 0 / 100% 100%;
  transition: background-size .5s ease;
}
.ink-in mark.hl { background-size: 0% 100%; }
.ink-in.inked mark.hl { background-size: 100% 100%; }

/* ---------- 顶栏 ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  background: color-mix(in srgb, var(--board) 88%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--rule);
}
.top .wrap { display: flex; align-items: center; gap: 20px; height: 60px; }
.top .me { font-weight: 700; color: var(--ink); text-decoration: none; font-size: 17px; letter-spacing: .02em; margin-right: auto; white-space: nowrap; }
.top nav { display: flex; gap: 4px; }
.top nav a { color: var(--graphite); text-decoration: none; font-size: 15px; padding: 6px 10px; border-radius: 6px; }
.top nav a:hover { color: var(--ink); }
.top nav a.on { color: var(--ink); box-shadow: inset 0 -2px 0 var(--marker); border-radius: 0; }
.ask-btn {
  display: inline-flex; align-items: center; gap: 8px; border: 0; cursor: pointer;
  background: var(--ink); color: var(--board); padding: 8px 14px 8px 12px; border-radius: 999px; font-size: 14px; font-weight: 600; white-space: nowrap;
}
.ask-btn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--hl); box-shadow: 0 0 0 3px color-mix(in srgb, var(--hl) 35%, transparent); }
@media (max-width: 760px) { .top nav { display: none; } }

/* ---------- 首屏 ---------- */
.hero { padding: 64px 0 40px; }
.hero .wrap { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 48px; align-items: start; }
.hero .role { color: var(--graphite); margin: 0 0 18px; font-size: 15px; }
.hero h1 {
  font-size: clamp(56px, 9vw, 104px); line-height: .95; margin: 0 0 22px; letter-spacing: .02em; font-weight: 800;
}
.hero h1 .en { display: block; font-family: var(--latin); font-stretch: 125%; font-weight: 300; font-size: .26em; letter-spacing: .04em; color: var(--graphite); margin-top: 14px; }
.hero .headline span { display: inline-block; }
.hero .headline { font-size: clamp(21px, 2.4vw, 26px); line-height: 1.45; font-weight: 600; margin: 0 0 14px; max-width: 18em; text-wrap: balance; }
.hero .bio { color: var(--graphite); margin: 0 0 26px; max-width: 32em; }
.cta { display: flex; flex-wrap: wrap; gap: 10px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 10px; cursor: pointer;
  border: 1.5px solid var(--ink); background: transparent; color: var(--ink); text-decoration: none; font-weight: 600; font-size: 15px;
}
.btn.solid { background: var(--marker); border-color: var(--marker); color: #fff; }
:root[data-theme="dark"] .btn.solid { color: #0f1520; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.solid { color: #0f1520; } }
.btn:hover { background: var(--marker-soft); }
.btn.solid:hover { background: var(--marker); filter: brightness(1.08); }
.hero .wrap.solo { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 900px) { .hero .wrap { grid-template-columns: 1fr; gap: 32px; } .hero { padding-top: 36px; } }

/* 白板：可拖动的便利贴，点「整理」按方法归类 */
.board {
  position: relative; background: var(--paper); border: 1px solid var(--rule); border-radius: 14px;
  height: 460px; overflow: hidden; touch-action: pan-y;
}
.board-bar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; align-items: center; gap: 8px; padding: 10px 12px;
  border-top: 1px solid var(--rule); background: color-mix(in srgb, var(--paper) 92%, transparent); }
.board-bar .hint { font-size: 13px; color: var(--graphite); margin-right: auto; line-height: 1.4; }
.chipbtn { border: 1px solid var(--rule); background: var(--paper); padding: 5px 12px; border-radius: 999px; cursor: pointer; font-size: 13px; white-space: nowrap; }
.chipbtn:hover { border-color: var(--ink); }
.chipbtn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.cols { position: absolute; inset: 0 0 52px; display: grid; grid-template-columns: repeat(4, 1fr); pointer-events: none; opacity: 0; transition: opacity .4s; }
.sorted .cols { opacity: 1; }
.cols div { position: relative; border-right: 1px dashed var(--rule); padding: 12px 10px 0; font-size: 14px; }
.cols b { display: block; }
.cols div:last-child { border-right: 0; }
.cols small { display: block; font-weight: 400; color: var(--graphite); font-size: 12px; }
.note {
  position: absolute; left: 0; top: 0; z-index: 2; cursor: grab; user-select: none; -webkit-user-select: none;
  background: var(--note); color: var(--note-ink); border: 0; padding: 6px 10px; font-size: 14px; line-height: 1.3; border-radius: 3px;
  box-shadow: 0 1px 0 color-mix(in srgb, var(--note-ink) 18%, transparent), 0 6px 14px -8px color-mix(in srgb, var(--ink) 40%, transparent);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px;
  transition: transform .75s cubic-bezier(.2, .8, .2, 1), width .5s, background .2s;
}
.note.s1 { background: #d9f0ff; color: #0c3a5c; }
.note.s2 { background: #ffe0d6; color: #5c1d0c; }
.note.s3 { background: #e3f6d8; color: #23440f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .note.s1 { background: #173550; color: #cfe8ff; } :root:not([data-theme="light"]) .note.s2 { background: #4a2418; color: #ffd9cc; } :root:not([data-theme="light"]) .note.s3 { background: #1f3a17; color: #d8f2c8; } }
:root[data-theme="dark"] .note.s1 { background: #173550; color: #cfe8ff; } :root[data-theme="dark"] .note.s2 { background: #4a2418; color: #ffd9cc; } :root[data-theme="dark"] .note.s3 { background: #1f3a17; color: #d8f2c8; }
.board.sorted .note { white-space: normal; text-align: left; }
.note.dragging { transition: none; cursor: grabbing; z-index: 4; }
.note.lit { outline: 2px solid var(--marker); }
.board.drift .note:not(.dragging) { animation: bob 6s ease-in-out infinite; animation-delay: var(--d, 0s); }
.board.sorted .note, .board.sorted.drift .note:not(.dragging) { animation: none; }
@keyframes bob { 50% { translate: 0 -5px; } }
@media (prefers-reduced-motion: reduce) { .note { transition: none; } .board.drift .note { animation: none; } mark.hl { transition: none; } }
.pop {
  position: absolute; z-index: 6; width: min(320px, calc(100% - 24px)); background: var(--paper); color: var(--ink);
  border: 1px solid var(--ink); border-radius: 10px; padding: 12px 14px; font-size: 14px; line-height: 1.6;
  box-shadow: 0 12px 30px -12px color-mix(in srgb, var(--ink) 50%, transparent);
}
.pop b { display: block; margin-bottom: 4px; }
.pop p { margin: 0 0 8px; }
.pop .src { color: var(--graphite); font-size: 12px; }
.pop .row { display: flex; gap: 8px; justify-content: space-between; align-items: center; margin-top: 4px; }
@media (max-width: 640px) { .board { height: 420px; } .note { font-size: 13px; padding: 5px 8px; } .cols div { font-size: 13px; padding: 8px 6px 0; } .cols small { display: none; } }

/* 关键数字 */
.stats { padding: 8px 0 24px; }
.stats ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0; border-top: 1.5px solid var(--ink); }
.stats li { padding: 18px 20px 6px 0; }
.stats .n { font-family: var(--latin), var(--cn); font-stretch: 125%; font-weight: 800; font-size: clamp(34px, 4vw, 46px); line-height: 1.1; display: inline-block; }
.stats .l { display: block; color: var(--graphite); font-size: 14px; margin-top: 6px; max-width: 18em; }

/* ---------- 分区通用 ---------- */
.sec { padding: 72px 0 24px; }
.sec-h { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 7fr); gap: 32px; align-items: end; margin-bottom: 32px; }
.sec-h h2 { font-size: clamp(30px, 4vw, 42px); line-height: 1.15; margin: 0; letter-spacing: .01em; }
.sec-h p { margin: 0; color: var(--graphite); max-width: 36em; }
@media (max-width: 800px) { .sec-h { grid-template-columns: 1fr; gap: 10px; } .sec { padding-top: 56px; } }

/* 方法：真实的先后顺序，所以编号 */
.method { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1.5px solid var(--ink); }
.step { padding: 20px 18px 22px 0; border-right: 1px solid var(--rule); }
.step + .step { padding-left: 18px; }
.step:last-child { border-right: 0; }
.step .no { font-family: var(--latin); font-stretch: 125%; font-weight: 300; font-size: 40px; line-height: 1; color: var(--marker); }
.step h3 { font-size: 20px; margin: 10px 0 4px; }
.step .def { color: var(--graphite); font-size: 14px; margin: 0 0 14px; }
.step ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.step li { font-size: 14px; line-height: 1.65; }
.step li .src { display: block; color: var(--graphite); font-size: 12px; margin-top: 2px; }
.step li.lit { background: var(--marker-soft); margin: -6px -8px; padding: 6px 8px; border-radius: 6px; }
.kws { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.kw { border: 1px solid var(--rule); background: var(--paper); border-radius: 999px; padding: 2px 10px; font-size: 12px; cursor: pointer; }
.kw[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
@media (max-width: 900px) { .method { grid-template-columns: 1fr 1fr; } .step:nth-child(2) { border-right: 0; } .step:nth-child(3) { padding-left: 0; } .step:nth-child(n+3) { border-top: 1px solid var(--rule); } }
@media (max-width: 560px) { .method { grid-template-columns: 1fr; } .step, .step + .step { padding-left: 0; border-right: 0; } .step + .step { border-top: 1px solid var(--rule); } }

/* 项目：一个项目一整行，媒体与文字左右交替 */
.case { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: 40px; padding: 36px 0; border-top: 1.5px solid var(--ink); align-items: start; }
.case:nth-child(even) .media { order: 2; }
.media { position: relative; border-radius: 12px; overflow: hidden; background: var(--ink); aspect-ratio: 640 / 432; }
.media video, .media img { display: block; width: 100%; height: 100%; object-fit: cover; }
.media .play {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 10px; border: 0; cursor: pointer;
  background: linear-gradient(transparent 55%, rgba(10, 16, 30, .65)); color: #fff; font-size: 15px; font-weight: 600;
}
.media .play span { display: inline-flex; align-items: center; gap: 10px; background: rgba(255, 255, 255, .94); color: #15213b; padding: 10px 18px; border-radius: 999px; }
.media .play svg { width: 14px; height: 14px; }
/* 没有图片 / 视频的项目：用项目自己的关键词拼一块白板 */
.typo { background: var(--paper); border: 1px solid var(--rule); color: var(--ink); display: flex; flex-direction: column; justify-content: space-between; padding: 22px; }
.typo .res { margin-top: 28px; }
.typo .big { display: block; font-family: var(--latin), var(--cn); font-stretch: 125%; font-weight: 800; font-size: clamp(56px, 7vw, 92px); line-height: 1; }
.typo .ctx { display: block; margin-top: 14px; color: var(--graphite); font-size: 15px; max-width: 22em; }
.typo .t { font-size: clamp(26px, 3.2vw, 38px); font-weight: 800; line-height: 1.15; max-width: 10em; }
.typo .tags { display: flex; flex-wrap: wrap; gap: 8px; }
.typo .tags span { background: var(--note); color: var(--note-ink); padding: 5px 10px; font-size: 13px; border-radius: 3px; rotate: var(--r, 0deg); }
.typo .open { position: absolute; right: 16px; top: 16px; font-size: 13px; }
.case .when { color: var(--graphite); font-size: 14px; margin: 0 0 6px; font-variant-numeric: tabular-nums; }
.case h3 { font-size: clamp(24px, 2.6vw, 30px); line-height: 1.25; margin: 0 0 12px; }
.case .lede { margin: 0 0 14px; }
.case .more { margin: 0 0 14px; padding: 0; list-style: none; display: grid; gap: 10px; }
.case .more li { font-size: 15px; color: var(--ink); }
.case .more li b { display: block; font-size: 13px; color: var(--graphite); font-weight: 600; }
.tagline { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0 0 18px; padding: 0; list-style: none; color: var(--graphite); font-size: 13px; }
.tagline li::before { content: '#'; color: var(--marker); margin-right: 2px; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; }
.acts .btn { padding: 8px 14px; font-size: 14px; }
@media (max-width: 860px) { .case { grid-template-columns: 1fr; gap: 20px; } .case:nth-child(even) .media { order: 0; } }

/* 经历：时间线 */
.tl { list-style: none; margin: 0; padding: 0; border-top: 1.5px solid var(--ink); }
.tl > li { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 28px; padding: 26px 0; border-bottom: 1px solid var(--rule); }
.tl .when { color: var(--graphite); font-size: 14px; font-variant-numeric: tabular-nums; padding-top: 4px; }
.tl h3 { font-size: 22px; margin: 0; }
.tl .title { color: var(--graphite); margin: 2px 0 10px; }
.tl .lede { margin: 0 0 10px; max-width: 46em; }
.tl .more { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 12px; max-width: 46em; }
.tl .more b { display: block; font-size: 13px; color: var(--graphite); }
.linkish { border: 0; background: none; color: var(--marker); cursor: pointer; padding: 0; font-weight: 600; font-size: 14px; }
@media (max-width: 640px) { .tl > li { grid-template-columns: 1fr; gap: 4px; } }

/* 教育背景：两所学校并排 */
.edu { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1.5px solid var(--ink); }
.edu .it { padding: 22px 28px 8px 0; display: flex; flex-direction: column; gap: 4px; }
.edu .it + .it { padding-left: 28px; border-left: 1px solid var(--rule); }
.edu .when { color: var(--graphite); font-size: 14px; font-variant-numeric: tabular-nums; }
.edu b { font-size: clamp(20px, 2.2vw, 24px); line-height: 1.35; }
.edu .deg { font-weight: 600; }
.edu p { margin: 6px 0 0; color: var(--graphite); font-size: 14px; max-width: 34em; }
@media (max-width: 760px) { .edu { grid-template-columns: 1fr; } .edu .it + .it { padding-left: 0; border-left: 0; border-top: 1px solid var(--rule); } }

/* 校园与技能 */
.bg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; border-top: 1.5px solid var(--ink); padding-top: 24px; }
.bg h3 { font-size: 15px; color: var(--graphite); margin: 0 0 12px; font-weight: 600; }
.bg .it { margin-bottom: 18px; }
.bg .it b { display: block; font-size: 17px; line-height: 1.4; }
.bg .it span { display: block; color: var(--graphite); font-size: 14px; }
.bg .it p { margin: 4px 0 0; font-size: 14px; }
.skills { display: flex; flex-wrap: wrap; gap: 6px; }
.skills span { border: 1px solid var(--rule); background: var(--paper); border-radius: 6px; padding: 3px 10px; font-size: 14px; }
@media (max-width: 860px) { .bg { grid-template-columns: 1fr; gap: 8px; } }
.about { margin-top: 40px; font-size: clamp(18px, 2vw, 21px); line-height: 1.75; max-width: 38em; }

/* 联系 */
.contact { padding: 88px 0 120px; }
.contact h2 { font-size: clamp(32px, 5vw, 56px); line-height: 1.15; margin: 0 0 18px; max-width: 14em; }
.contact .mail { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; font-family: var(--latin), var(--cn); font-size: clamp(20px, 2.6vw, 28px); font-weight: 600; margin-bottom: 22px; word-break: break-all; }
.contact .mail a { color: var(--ink); text-decoration-thickness: 2px; text-decoration-color: var(--hl); }
footer { border-top: 1px solid var(--rule); padding: 20px 0 40px; color: var(--graphite); font-size: 13px; }
footer .wrap { display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: space-between; }

/* ---------- AI 分身面板 ---------- */
.agent {
  position: fixed; z-index: 50; top: 0; right: 0; bottom: 0; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); width: min(420px, 100vw);
  background: var(--paper); border-left: 1px solid var(--rule); display: flex; flex-direction: column;
  box-shadow: -20px 0 50px -30px color-mix(in srgb, var(--ink) 60%, transparent);
  transform: translateX(100%); visibility: hidden; transition: transform .35s cubic-bezier(.2, .8, .2, 1), visibility 0s .35s;
}
.agent.open { transform: none; visibility: visible; transition: transform .35s cubic-bezier(.2, .8, .2, 1); }
@media (prefers-reduced-motion: reduce) { .agent, .agent.open { transition: none; } }
.agent header { display: flex; align-items: flex-start; gap: 12px; padding: 18px 18px 14px; border-bottom: 1px solid var(--rule); }
.agent header div { margin-right: auto; }
.agent header b { display: block; font-size: 17px; }
.agent header small { color: var(--graphite); font-size: 13px; }
.x { border: 1px solid var(--rule); background: none; border-radius: 8px; width: 34px; height: 34px; cursor: pointer; font-size: 18px; line-height: 1; flex: none; }
.msgs { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; overscroll-behavior: contain; }
.msg { max-width: 88%; padding: 10px 14px; border-radius: 14px; font-size: 15px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
.msg.bot { background: var(--board); align-self: flex-start; border-bottom-left-radius: 4px; }
.msg.me { background: var(--ink); color: var(--paper); align-self: flex-end; border-bottom-right-radius: 4px; }
.msg.typing { color: var(--graphite); }
.msg.typing::after { content: ''; display: inline-block; width: 1.2em; text-align: left; animation: dots 1.2s steps(4) infinite; }
@keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
.sugg { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 18px 12px; }

      const rules = `${PERSONA}\n\n规则：只依据下面的公开资料回答；资料里没有的内容不要编造，直接说不确定并建议发邮件联系；不要透露手机号；用中文回答，简洁具体，不超过 200 字，不用 Markdown 标题。\n\n公开资料（JSON）：\n${JSON.stringify(DATA)}`;
      try {
        const { text } = await sample([{ role: 'user', content: rules }, ...agent.history.slice(-8)], { cache: false, modelTier: 'quick', onText: ({ text }) => onText(text) });
        return text;
      } catch (e) {
        if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed', 'session_expired'].includes(e?.code)) aiOff = true;
        if (e?.code === 'rate_limited') return '现在问得有点多，稍等一会儿再问。下面是简历原文里的相关内容：\n' + localAnswer(DATA, q);
      }
    }
    return localAnswer(DATA, q);
  }

  // 只给「带量词的数字」划荧光笔：10 万+、500+、37%、30 分钟……年份和热线号码不划
  const NUM = /(?<![\d\-—–])(\d+(?:\.\d+)?\s*(?:万\s*\+?|千\s*\+?|\+|%|\s*(?:个|条|份|名|项(?!目)|次|例|轮|分钟|人次|倍)))/g;
  const hl = (t) => esc(t).replace(NUM, '<mark class="hl">$1</mark>');

  // 描述按行拆：「小标题：内容」
  const lines = (d) => String(d || '').split(/\n+/).map((l) => l.trim()).filter(Boolean).map((l) => {
    const m = l.match(/^([^：:]{2,14})[：:]\s*(.+)$/);
    return m ? { head: m[1], text: m[2] } : { head: '', text: l };
  });
  const isBg = (x) => /背景|简介|概述/.test(x.head);

  // ---------- 方法：从经历和项目里自动找证据 ----------
  const STAGES = [
    { name: '发现', def: '先弄清楚用户真正卡在哪', kws: [['用户调研', /用户调研|需求调研|调研/], ['用户访谈', /访谈/], ['问卷', /问卷/], ['NLP 分词', /NLP|分词/], ['词频分析', /词频/], ['卡片分类法', /卡片分类/], ['Say-Do-Make', /say-do-make/i], ['行为路径', /行为路径/], ['数据埋点', /埋点/], ['日志清洗', /日志|清洗/], ['痛点挖掘', /痛点/]] },
    { name: '判断', def: '决定先做什么、不做什么', kws: [['Kano 模型', /kano/i], ['重要-紧急四象限', /四象限/], ['优先级', /优先级/], ['排期', /排期/], ['功能规划', /功能规划|产品规划/], ['数值设计', /数值/], ['机制设计', /机制|博弈/]] },
    { name: '设计', def: '把方案画成能讨论的原型', kws: [['高保真原型', /高保真|原型/], ['Figma', /figma/i], ['墨刀', /墨刀/], ['信息架构', /信息架构/], ['交互规范', /交互流程|交互规范|关键交互|交互路径/], ['数据可视化', /可视化|仪表盘|热力图/], ['软硬件联调', /软硬件|联调/], ['异常兜底', /兜底/]] },
    { name: '验证', def: '用测试和数据确认它真的有用', kws: [['可用性测试', /可用性测试/], ['有声思考法', /有声思考/], ['满意度', /满意度/], ['场景验收', /验收/], ['误报回流训练', /误报|模型迭代/], ['缺陷管理', /缺陷/], ['功能测试', /功能测试/], ['实测数据', /实测|预警|告警/]] },
  ];
  function evidence(p) {
    const sents = [];
    const add = (src, d) => lines(d).filter((l) => !isBg(l)).forEach((l) => l.text.split(/[；;]/).map((t) => t.trim().replace(/[。.]$/, '')).filter((t) => t.length > 8).forEach((t) => sents.push({ src, text: t, ord: sents.length })));
    [...(p.experience || []), ...(p.work || [])].forEach((e) => add(e.company, e.description));
    (p.projects || []).forEach((x) => add(x.name, x.description));
    const all = sents.map((s) => s.text).join('\n');
    return STAGES.map((st, si) => {
      const kws = st.kws.filter(([, re]) => re.test(all)).map(([label, re]) => ({ label, re, stage: si }));
      const scored = sents.map((s) => {
        const hits = kws.filter((k) => k.re.test(s.text)).length;
        const nums = (s.text.match(NUM) || []).length;
        return { ...s, score: hits * 3 + nums, hits };
      }).filter((s) => s.hits).sort((a, b) => b.score - a.score);
      const pick = [], seen = new Set();
      for (const s of scored) { if (pick.length >= 3) break; if (seen.has(s.src) && scored.some((o) => !seen.has(o.src) && !pick.includes(o) && o.score >= s.score - 2)) continue; pick.push(s); seen.add(s.src); }
      // 选出来的按简历顺序排：先实习（按时间），再项目
      pick.sort((a, b) => a.ord - b.ord);
      return { ...st, kws, items: pick, sents: scored };
    });
  }

      b.textContent = n.label;
      b.style.setProperty('--d', (-Math.random() * 6).toFixed(2) + 's');
      el.append(b);
      n.el = b;
    }
    const pos = (n, x, y, w) => { n.x = x; n.y = y; n.el.style.transform = `translate(${x}px, ${y}px)`; n.el.style.width = w ? w + 'px' : ''; };
    let sorted = false;
    const W = () => el.clientWidth, H = () => el.clientHeight - 52;
    function scatter() {
      sorted = false; el.classList.remove('sorted'); el.style.height = '';
      const w = W(), h = H(), cols = Math.max(2, Math.round(Math.sqrt(notes.length * w / h))), rows = Math.ceil(notes.length / cols);
      const order = notes.map((n, i) => i).sort(() => Math.random() - .5);
      order.forEach((ni, k) => {
        const n = notes[ni];
        n.el.style.width = ''; n.el.classList.remove('wrapnote');
        const cw = w / cols, ch = h / rows, nw = n.el.offsetWidth, nh = n.el.offsetHeight;
        const cx = (k % cols) * cw, cy = Math.floor(k / cols) * ch;
        pos(n, Math.max(8, Math.min(w - nw - 8, cx + Math.random() * Math.max(4, cw - nw))), Math.max(14, Math.min(h - nh - 10, cy + 10 + Math.random() * Math.max(4, ch - nh - 10))));
        n.el.style.rotate = (Math.random() * 6 - 3).toFixed(1) + 'deg';
      });
      $('#sortBtn').textContent = '整理成方法';
      $('#boardHint').textContent = '这些是我简历里用到的方法。拖一拖，或者点「整理」。';
    }
    function sort() {
      sorted = true; el.classList.add('sorted');
      const w = W(), cw = w / 4, top = Math.max(...$$('.cols b, .cols small', el).filter((x) => x.offsetParent).map((x) => x.offsetTop + x.offsetHeight)) + 10;
      // 先定宽（窄屏时便利贴会换行），再按每列实际高度往下排
      notes.forEach((n) => { n.el.style.width = cw - 12 + 'px'; n.el.style.rotate = '0deg'; });
      const y = [top, top, top, top];
      notes.forEach((n, k) => {
        const ty = y[n.si]; y[n.si] += n.el.offsetHeight + 8;
        setTimeout(() => pos(n, n.si * cw + 6, ty, cw - 12), reduce ? 0 : k * 35);
      });
      // 窄屏换行后列变高：白板跟着长高，别让最后几张被底栏挡住
      el.style.height = Math.max(Math.max(...y) + 52 + 6, innerWidth <= 640 ? 420 : 460) + 'px';
      $('#sortBtn').textContent = '打散';
      $('#boardHint').textContent = '点任意一张便利贴，看它出现在哪段经历里。';
    }
    $('#sortBtn').onclick = () => (sorted ? scatter() : sort());
    const motion = $('#motion');
    const setMotion = (on) => { el.classList.toggle('drift', on); motion.setAttribute('aria-pressed', String(!on)); motion.textContent = on ? '暂停动效' : '恢复动效'; store.set('rf-motion', on ? '1' : '0'); };
    motion.onclick = () => setMotion(!el.classList.contains('drift'));
    setMotion(!reduce && store.get('rf-motion') !== '0');

    // 拖动；没拖动就当点击：弹出这条方法在哪些经历里出现过
    let pop = null;
    const closePop = () => { pop?.remove(); pop = null; notes.forEach((n) => n.el.classList.remove('lit')); };
    for (const n of notes) {
      n.el.addEventListener('pointerdown', (e) => {
        if (e.button) return;
        const sx = e.clientX, sy = e.clientY, ox = n.x, oy = n.y;
        let moved = false;
        n.el.setPointerCapture(e.pointerId);
        const mv = (ev) => {
          const dx = ev.clientX - sx, dy = ev.clientY - sy;
          if (!moved && Math.hypot(dx, dy) < 5) return;
          if (!moved) { moved = true; closePop(); n.el.classList.add('dragging'); }
          pos(n, Math.max(0, Math.min(W() - n.el.offsetWidth, ox + dx)), Math.max(0, Math.min(H() - n.el.offsetHeight, oy + dy)), sorted ? W() / 4 - 12 : 0);
        };
        const up = () => { n.el.removeEventListener('pointermove', mv); n.el.removeEventListener('pointerup', up); n.el.removeEventListener('pointercancel', up); n.el.classList.remove('dragging'); if (moved) n.el.dataset.dragged = '1'; };
        n.el.addEventListener('pointermove', mv); n.el.addEventListener('pointerup', up); n.el.addEventListener('pointercancel', up);
      });
      n.el.addEventListener('click', () => {
        if (n.el.dataset.dragged) { delete n.el.dataset.dragged; return; }
        const was = n.el.classList.contains('lit');
        closePop();
        if (was) return;
        n.el.classList.add('lit');
        const hits = st[n.si].sents.filter((s) => n.re.test(s.text)).slice(0, 2).sort((a, b) => a.ord - b.ord);
        pop = document.createElement('div');
        pop.className = 'pop';
        pop.innerHTML = `<b>${esc(n.label)}　<span style="font-weight:400;color:var(--graphite)">${esc(st[n.si].name)}</span></b>${hits.map((h) => `<p>${hl(h.text)}<br><span class="src">${esc(h.src)}</span></p>`).join('')}
          <div class="row"><button class="linkish" data-ask="${esc(`他是怎么用「${n.label}」的？举个具体例子`)}">问 AI 具体怎么用</button><button class="chipbtn" data-closepop>关闭</button></div>`;
        el.append(pop);
        const w = W(), pw = pop.offsetWidth;
        pop.style.left = Math.max(12, Math.min(w - pw - 12, n.x + n.el.offsetWidth / 2 - pw / 2)) + 'px';
        const below = n.y + n.el.offsetHeight + 8;
        pop.style.top = (below + pop.offsetHeight < H() ? below : Math.max(8, n.y - pop.offsetHeight - 8)) + 'px';
        $('[data-closepop]', pop).onclick = closePop;
      });
    }
    // 先打散；进入视野后自动整理一次（页面里唯一一次自动的动画）
    scatter();
    if (reduce) sort();
    else {
      const io = new IntersectionObserver((es) => { if (es[0].isIntersecting) { io.disconnect(); setTimeout(() => !sorted && sort(), 1400); } }, { threshold: .6 });
      io.observe(el);
    }
    let rw = W();
    addEventListener('resize', () => { if (Math.abs(W() - rw) < 20) return; rw = W(); closePop(); sorted ? sort() : scatter(); });
  }

  // ---------- 其它交互 ----------
  function wire(st) {
    // 荧光笔：滚到时划上
    const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('inked'); io.unobserve(e.target); } }), { threshold: .4 });
    $$('.ink-in').forEach((x) => (reduce ? x.classList.add('inked') : io.observe(x)));

    // 方法关键词筛选
    $$('.kw').forEach((b) => b.onclick = () => {
      const step = b.closest('.step'), si = +step.dataset.stage, on = b.getAttribute('aria-pressed') !== 'true';
      $$('.kw', step).forEach((x) => x.setAttribute('aria-pressed', 'false'));
      const ul = $('ul', step);
      const s = st[si];
      const kw = s.kws.find((k) => k.label === b.dataset.kw);
      const items = on ? s.sents.filter((x) => kw.re.test(x.text)).slice(0, 3).sort((a, b) => a.ord - b.ord) : s.items;
      if (on) b.setAttribute('aria-pressed', 'true');
      ul.innerHTML = items.map((it) => `<li class="${on ? 'lit' : ''}">${hl(it.text)}<span class="src">${esc(it.src)}</span></li>`).join('');
    });

    // 视频：点封面播放
    $$('[data-play]').forEach((b) => b.onclick = () => { const v = $('video', b.parentElement); b.remove(); v.preload = 'auto'; v.play().catch(() => {}); });
    // 项目案例展开
    $$('[data-expand]').forEach((b) => b.onclick = () => {
      const box = b.closest('.ink-in'), open = b.getAttribute('aria-expanded') !== 'true';
      $$('[data-extra]', box).forEach((li) => (li.hidden = !open));
      b.setAttribute('aria-expanded', String(open)); b.textContent = open ? '收起' : '看完整案例';
    });
    // 经历展开
    $$('[data-toggle]').forEach((b) => b.onclick = () => {
      const ul = b.previousElementSibling, open = ul.hidden;
      ul.hidden = !open; b.setAttribute('aria-expanded', String(open)); b.textContent = open ? '收起' : '展开具体做了什么';
    });
    $('#copyMail')?.addEventListener('click', async (e) => {
      const t = $('.mail a').textContent;
      try { await navigator.clipboard.writeText(t); e.target.textContent = '已复制'; } catch { e.target.textContent = '复制失败，请手动选择'; }
      setTimeout(() => (e.target.textContent = '复制邮箱'), 2000);
    });
    // 导航高亮当前分区
    const links = $$('[data-spy]');
    const spy = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) links.forEach((a) => a.classList.toggle('on', a.dataset.spy === e.target.id)); }), { rootMargin: '-45% 0px -50% 0px' });
    links.forEach((a) => { const s = document.getElementById(a.dataset.spy); if (s) spy.observe(s); });
    // 首屏之后显示悬浮按钮
    const hero = $('.intro');
    if (hero) new IntersectionObserver((es) => $('#fab').classList.toggle('on', !es[0].isIntersecting && !agent.open), { threshold: 0 }).observe(hero);
  }

  // ---------- AI 分身 ----------
  const agent = { open: false, history: [], asked: new Set(), suggestions: [], follow: [] };
  function openAgent(q) {
    agent.open = true;
    $('#agent').classList.add('open'); $('#agent').setAttribute('aria-hidden', 'false');
    $('#scrim').classList.add('on'); $('#fab').classList.remove('on');
    if (q) ask(q); else setTimeout(() => $('#q').focus(), 50);
  }
  function closeAgent() {
    agent.open = false;
    $('#agent').classList.remove('open'); $('#agent').setAttribute('aria-hidden', 'true');
    $('#scrim').classList.remove('on');
    if (scrollY > innerHeight * .8) $('#fab').classList.add('on');
  }
  function addMsg(role, text) {
    const d = document.createElement('div');
    d.className = 'msg ' + (role === 'user' ? 'me' : 'bot');
    d.textContent = text;
    $('#msgs').append(d); $('#msgs').scrollTop = 1e9;
    return d;
  }
  function renderSugg(extra = []) {
    agent.follow = [...new Set([...extra, ...agent.follow])].filter((x) => !agent.asked.has(x));
    const list = [...new Set([...agent.follow.slice(0, 2), ...agent.suggestions])].filter((x) => !agent.asked.has(x)).slice(0, 4);
    $('#sugg').innerHTML = '';
    for (const s of list) { const b = document.createElement('button'); b.textContent = s; b.onclick = () => ask(s); $('#sugg').append(b); }
  }
  async function ask(q) {
    q = String(q || '').trim();
    if (!q || ask.busy) return;
    ask.busy = true; agent.asked.add(q);
    $('#sugg').innerHTML = ''; $('#askForm button').disabled = true;
    addMsg('user', q); agent.history.push({ role: 'user', content: q });
    const t = addMsg('bot', '正在想'); t.classList.add('typing');
    try {
      const d = { answer: await answer(q, (text) => { t.textContent = text; t.classList.remove('typing'); $('#msgs').scrollTop = 1e9; }) };
      t.textContent = d.answer; t.classList.remove('typing');
      agent.history.push({ role: 'assistant', content: d.answer });
      const pub = window.__pub || {}, follow = [];
      for (const x of pub.projects || []) if (x.name && d.answer.includes(x.name.split(/\s/)[0]) && !q.includes(x.name.split(/\s/)[0])) follow.push(`详细说说「${x.name}」`);
      for (const e of [...(pub.experience || []), ...(pub.work || [])]) if (e.company && d.answer.includes(e.company) && !q.includes(e.company)) follow.push(`在${e.company}具体做了什么？`);
      renderSugg(follow.slice(0, 2));
    } catch (e) {
      t.textContent = `没能拿到回答：${e.message}。可以稍后再试，或者直接发邮件。`; t.classList.remove('typing');
      renderSugg();
    } finally { ask.busy = false; $('#askForm button').disabled = false; $('#q').focus({ preventScroll: true }); }
  }

  document.addEventListener('click', (e) => {
    const a = e.target.closest('[data-ask]');
    if (a) { e.preventDefault(); openAgent(a.dataset.ask); return; }
    if (e.target.closest('[data-open-agent]')) openAgent();
  });
  $('#closeAgent').onclick = closeAgent;
  $('#scrim').onclick = closeAgent;
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && agent.open) closeAgent(); });
  $('#askForm').onsubmit = (e) => { e.preventDefault(); const q = $('#q').value; if (!q.trim() || ask.busy) return; $('#q').value = ''; ask(q); };

  (async () => {
    const p = DATA;
    window.__pub = p;
    document.title = `${p.name}${p.headline ? ' · ' + p.headline : ' · 个人主页'}`;
    const st = render(p);
    board(st);
    wire(st);
    $('#agentTitle').textContent = `${p.name}的 AI 分身`;
    addMsg('bot', p.welcome || `你好，我是${p.name}的 AI 分身。可以问我${p.name}的项目、经历、做事方法，或者求职意向。`);
    agent.suggestions = p.questions?.length ? p.questions : ['做过哪些项目？', '有什么实习经历？', '擅长什么？', '在哪里读书？', '求职意向是什么？', '怎么联系？'];
    renderSugg();
    if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
  })();
})();

</script>
</body>
</html>
