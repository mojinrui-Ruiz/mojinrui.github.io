<title>莫晋睿 · 个人主页</title>

<style>
/* 个人主页：白板 / 亲和图的视觉语言。马克笔蓝写字，荧光笔只划真实数字 */
:root {
  --board: #eef1f4;
  --paper: #ffffff;
  --ink: #15213b;
  --graphite: #5a6577;
  --rule: #ccd3dc;
  --marker: #2448c9;
  --marker-soft: #dfe6fb;
  --hl: #ffe45c;
  --note: #fff7c2;
  --note-ink: #4a3d00;
  --latin: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
  --cn: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  --font: var(--latin), var(--cn);
  color-scheme: light only;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0; background: var(--board); color: var(--ink);
  font: 16px/1.7 var(--font); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  /* 白板上淡淡的点阵 */
  background-image: radial-gradient(color-mix(in srgb, var(--rule) 70%, transparent) 1px, transparent 1px);
  background-size: 22px 22px;
}
a { color: var(--marker); text-underline-offset: 3px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--marker); outline-offset: 3px; border-radius: 4px; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }
@media (max-width: 640px) { .wrap { padding: 0 16px; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* 荧光笔：只用在数字上 */
mark.hl {
  color: inherit; padding: 0 .12em; border-radius: 2px;
  background: linear-gradient(transparent 52%, var(--hl) 52%, var(--hl) 92%, transparent 92%) no-repeat 0 0 / 100% 100%;
  transition: background-size .5s ease;
}
.ink-in mark.hl { background-size: 0% 100%; }
.ink-in.inked mark.hl { background-size: 100% 100%; }

/* ---------- 顶栏 ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  background: color-mix(in srgb, var(--board) 88%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--rule);
}
.top .wrap { display: flex; align-items: center; gap: 20px; height: 60px; }
.top .me { font-weight: 700; color: var(--ink); text-decoration: none; font-size: 17px; letter-spacing: .02em; margin-right: auto; white-space: nowrap; }
.top nav { display: flex; gap: 4px; }
.top nav a { color: var(--graphite); text-decoration: none; font-size: 15px; padding: 6px 10px; border-radius: 6px; }
.top nav a:hover { color: var(--ink); }
.top nav a.on { color: var(--ink); box-shadow: inset 0 -2px 0 var(--marker); border-radius: 0; }
.ask-btn {
  display: inline-flex; align-items: center; gap: 8px; border: 0; cursor: pointer;
  background: var(--ink); color: var(--board); padding: 8px 14px 8px 12px; border-radius: 999px; font-size: 14px; font-weight: 600; white-space: nowrap;
}
.ask-btn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--hl); box-shadow: 0 0 0 3px color-mix(in srgb, var(--hl) 35%, transparent); }
@media (max-width: 760px) { .top nav { display: none; } }

/* ---------- 首屏 ---------- */
.hero { padding: 64px 0 40px; }
.hero .wrap { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 48px; align-items: start; }
.hero .role { color: var(--graphite); margin: 0 0 18px; font-size: 15px; }
.hero h1 {
  font-size: clamp(56px, 9vw, 104px); line-height: .95; margin: 0 0 22px; letter-spacing: .02em; font-weight: 800;
}
.hero h1 .en { display: block; font-family: var(--latin); font-stretch: 125%; font-weight: 300; font-size: .26em; letter-spacing: .04em; color: var(--graphite); margin-top: 14px; }
.hero .headline span { display: inline-block; }
.hero .headline { font-size: clamp(21px, 2.4vw, 26px); line-height: 1.45; font-weight: 600; margin: 0 0 14px; max-width: 18em; text-wrap: balance; }
.hero .bio { color: var(--graphite); margin: 0 0 26px; max-width: 32em; }
.cta { display: flex; flex-wrap: wrap; gap: 10px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 10px; cursor: pointer;
  border: 1.5px solid var(--ink); background: transparent; color: var(--ink); text-decoration: none; font-weight: 600; font-size: 15px;
}
.btn.solid { background: var(--marker); border-color: var(--marker); color: #fff; }
.btn:hover { background: var(--marker-soft); }
.btn.solid:hover { background: var(--marker); filter: brightness(1.08); }
.hero .wrap.solo { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 900px) { .hero .wrap { grid-template-columns: 1fr; gap: 32px; } .hero { padding-top: 36px; } }

/* 白板：可拖动的便利贴，点「整理」按方法归类 */
.board {
  position: relative; background: var(--paper); border: 1px solid var(--rule); border-radius: 14px;
  height: 460px; overflow: hidden; touch-action: pan-y;
}
.board-bar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; align-items: center; gap: 8px; padding: 10px 12px;
  border-top: 1px solid var(--rule); background: color-mix(in srgb, var(--paper) 92%, transparent); }
.board-bar .hint { font-size: 13px; color: var(--graphite); margin-right: auto; line-height: 1.4; }
.chipbtn { border: 1px solid var(--rule); background: var(--paper); padding: 5px 12px; border-radius: 999px; cursor: pointer; font-size: 13px; white-space: nowrap; }
.chipbtn:hover { border-color: var(--ink); }
.chipbtn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.cols { position: absolute; inset: 0 0 52px; display: grid; grid-template-columns: repeat(4, 1fr); pointer-events: none; opacity: 0; transition: opacity .4s; }
.sorted .cols { opacity: 1; }
.cols div { position: relative; border-right: 1px dashed var(--rule); padding: 12px 10px 0; font-size: 14px; }
.cols b { display: block; }
.cols div:last-child { border-right: 0; }
.cols small { display: block; font-weight: 400; color: var(--graphite); font-size: 12px; }
.note {
  position: absolute; left: 0; top: 0; z-index: 2; cursor: grab; user-select: none; -webkit-user-select: none;
  background: var(--note); color: var(--note-ink); border: 0; padding: 6px 10px; font-size: 14px; line-height: 1.3; border-radius: 3px;
  box-shadow: 0 1px 0 color-mix(in srgb, var(--note-ink) 18%, transparent), 0 6px 14px -8px color-mix(in srgb, var(--ink) 40%, transparent);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px;
  transition: transform .75s cubic-bezier(.2, .8, .2, 1), width .5s, background .2s;
}
.note.s1 { background: #d9f0ff; color: #0c3a5c; }
.note.s2 { background: #ffe0d6; color: #5c1d0c; }
.note.s3 { background: #e3f6d8; color: #23440f; }

.board.sorted .note { white-space: normal; text-align: left; }
.note.dragging { transition: none; cursor: grabbing; z-index: 4; }
.note.lit { outline: 2px solid var(--marker); }
.board.drift .note:not(.dragging) { animation: bob 6s ease-in-out infinite; animation-delay: var(--d, 0s); }
.board.sorted .note, .board.sorted.drift .note:not(.dragging) { animation: none; }
@keyframes bob { 50% { translate: 0 -5px; } }
@media (prefers-reduced-motion: reduce) { .note { transition: none; } .board.drift .note { animation: none; } mark.hl { transition: none; } }
.pop {
  position: absolute; z-index: 6; width: min(320px, calc(100% - 24px)); background: var(--paper); color: var(--ink);
  border: 1px solid var(--ink); border-radius: 10px; padding: 12px 14px; font-size: 14px; line-height: 1.6;
  box-shadow: 0 12px 30px -12px color-mix(in srgb, var(--ink) 50%, transparent);
}
.pop b { display: block; margin-bottom: 4px; }
.pop p { margin: 0 0 8px; }
.pop .src { color: var(--graphite); font-size: 12px; }
.pop .row { display: flex; gap: 8px; justify-content: space-between; align-items: center; margin-top: 4px; }
@media (max-width: 640px) { .board { height: 420px; } .note { font-size: 13px; padding: 5px 8px; } .cols div { font-size: 13px; padding: 8px 6px 0; } .cols small { display: none; } }

/* 关键数字 */
.stats { padding: 8px 0 24px; }
.stats ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0; border-top: 1.5px solid var(--ink); }
.stats li { padding: 18px 20px 6px 0; }
.stats .n { font-family: var(--latin), var(--cn); font-stretch: 125%; font-weight: 800; font-size: clamp(34px, 4vw, 46px); line-height: 1.1; display: inline-block; }
.stats .l { display: block; color: var(--graphite); font-size: 14px; margin-top: 6px; max-width: 18em; }

/* ---------- 分区通用 ---------- */
.sec { padding: 72px 0 24px; }
.sec-h { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 7fr); gap: 32px; align-items: end; margin-bottom: 32px; }
.sec-h h2 { font-size: clamp(30px, 4vw, 42px); line-height: 1.15; margin: 0; letter-spacing: .01em; }
.sec-h p { margin: 0; color: var(--graphite); max-width: 36em; }
@media (max-width: 800px) { .sec-h { grid-template-columns: 1fr; gap: 10px; } .sec { padding-top: 56px; } }

/* 方法：真实的先后顺序，所以编号 */
.method { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1.5px solid var(--ink); }
.step { padding: 20px 18px 22px 0; border-right: 1px solid var(--rule); }
.step + .step { padding-left: 18px; }
.step:last-child { border-right: 0; }
.step .no { font-family: var(--latin); font-stretch: 125%; font-weight: 300; font-size: 40px; line-height: 1; color: var(--marker); }
.step h3 { font-size: 20px; margin: 10px 0 4px; }
.step .def { color: var(--graphite); font-size: 14px; margin: 0 0 14px; }
.step ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.step li { font-size: 14px; line-height: 1.65; }
.step li .src { display: block; color: var(--graphite); font-size: 12px; margin-top: 2px; }
.step li.lit { background: var(--marker-soft); margin: -6px -8px; padding: 6px 8px; border-radius: 6px; }
.kws { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.kw { border: 1px solid var(--rule); background: var(--paper); border-radius: 999px; padding: 2px 10px; font-size: 12px; cursor: pointer; }
.kw[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
@media (max-width: 900px) { .method { grid-template-columns: 1fr 1fr; } .step:nth-child(2) { border-right: 0; } .step:nth-child(3) { padding-left: 0; } .step:nth-child(n+3) { border-top: 1px solid var(--rule); } }
@media (max-width: 560px) { .method { grid-template-columns: 1fr; } .step, .step + .step { padding-left: 0; border-right: 0; } .step + .step { border-top: 1px solid var(--rule); } }

/* 项目：一个项目一整行，媒体与文字左右交替 */
.case { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: 40px; padding: 36px 0; border-top: 1.5px solid var(--ink); align-items: start; }
.case:nth-child(even) .media { order: 2; }
.media { position: relative; border-radius: 12px; overflow: hidden; background: var(--ink); aspect-ratio: 640 / 432; }
.media video, .media img { display: block; width: 100%; height: 100%; object-fit: cover; }
.media .play {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 10px; border: 0; cursor: pointer;
  background: linear-gradient(transparent 55%, rgba(10, 16, 30, .65)); color: #fff; font-size: 15px; font-weight: 600;
}
.media .play span { display: inline-flex; align-items: center; gap: 10px; background: rgba(255, 255, 255, .94); color: #15213b; padding: 10px 18px; border-radius: 999px; }
.media .play svg { width: 14px; height: 14px; }
/* 没有图片 / 视频的项目：用项目自己的关键词拼一块白板 */
.typo { background: var(--paper); border: 1px solid var(--rule); color: var(--ink); display: flex; flex-direction: column; justify-content: space-between; padding: 22px; }
.typo .res { margin-top: 28px; }
.typo .big { display: block; font-family: var(--latin), var(--cn); font-stretch: 125%; font-weight: 800; font-size: clamp(56px, 7vw, 92px); line-height: 1; }
.typo .ctx { display: block; margin-top: 14px; color: var(--graphite); font-size: 15px; max-width: 22em; }
.typo .t { font-size: clamp(26px, 3.2vw, 38px); font-weight: 800; line-height: 1.15; max-width: 10em; }
.typo .tags { display: flex; flex-wrap: wrap; gap: 8px; }
.typo .tags span { background: var(--note); color: var(--note-ink); padding: 5px 10px; font-size: 13px; border-radius: 3px; rotate: var(--r, 0deg); }
.typo .open { position: absolute; right: 16px; top: 16px; font-size: 13px; }
.case .when { color: var(--graphite); font-size: 14px; margin: 0 0 6px; font-variant-numeric: tabular-nums; }
.case h3 { font-size: clamp(24px, 2.6vw, 30px); line-height: 1.25; margin: 0 0 12px; }
.case .lede { margin: 0 0 14px; }
.case .more { margin: 0 0 14px; padding: 0; list-style: none; display: grid; gap: 10px; }
.case .more li { font-size: 15px; color: var(--ink); }
.case .more li b { display: block; font-size: 13px; color: var(--graphite); font-weight: 600; }
.tagline { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0 0 18px; padding: 0; list-style: none; color: var(--graphite); font-size: 13px; }
.tagline li::before { content: '#'; color: var(--marker); margin-right: 2px; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; }
.acts .btn { padding: 8px 14px; font-size: 14px; }
@media (max-width: 860px) { .case { grid-template-columns: 1fr; gap: 20px; } .case:nth-child(even) .media { order: 0; } }

/* 经历：时间线 */
.tl { list-style: none; margin: 0; padding: 0; border-top: 1.5px solid var(--ink); }
.tl > li { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 28px; padding: 26px 0; border-bottom: 1px solid var(--rule); }
.tl .when { color: var(--graphite); font-size: 14px; font-variant-numeric: tabular-nums; padding-top: 4px; }
.tl h3 { font-size: 22px; margin: 0; }
.tl .title { color: var(--graphite); margin: 2px 0 10px; }
.tl .lede { margin: 0 0 10px; max-width: 46em; }
.tl .more { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 12px; max-width: 46em; }
.tl .more b { display: block; font-size: 13px; color: var(--graphite); }
.linkish { border: 0; background: none; color: var(--marker); cursor: pointer; padding: 0; font-weight: 600; font-size: 14px; }
@media (max-width: 640px) { .tl > li { grid-template-columns: 1fr; gap: 4px; } }

/* 教育背景：两所学校并排 */
.edu { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1.5px solid var(--ink); }
.edu .it { padding: 22px 28px 8px 0; display: flex; gap: 18px; align-items: flex-start; }
.edu .info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.edu .crest { flex: none; width: 80px; height: 80px; box-sizing: border-box; padding: 8px; display: flex; align-items: center; justify-content: center; background: #fff; border: 1px solid var(--rule); border-radius: 16px; overflow: hidden; }
.edu .crest img { display: block; width: 100%; height: 100%; object-fit: contain; }
.edu .crest .mono { font-family: var(--latin), var(--cn); font-stretch: 112%; font-weight: 800; font-size: 15px; color: var(--marker); letter-spacing: .02em; }
.edu .badge { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; padding: 2px 10px 2px 8px; border-radius: 999px; background: var(--hl); color: var(--ink); }
.edu .badge::before { content: '★'; font-size: 11px; }
.edu .it + .it { padding-left: 28px; border-left: 1px solid var(--rule); }
.edu .when { color: var(--graphite); font-size: 14px; font-variant-numeric: tabular-nums; }
.edu b { font-size: clamp(20px, 2.2vw, 24px); line-height: 1.35; }
.edu .deg { font-weight: 600; }
.edu p { margin: 6px 0 0; color: var(--graphite); font-size: 14px; max-width: 34em; }
@media (max-width: 760px) { .edu { grid-template-columns: 1fr; } .edu .it + .it { padding-left: 0; border-left: 0; border-top: 1px solid var(--rule); } }

/* 校园与技能 */
.bg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; border-top: 1.5px solid var(--ink); padding-top: 24px; }
.bg h3 { font-size: 15px; color: var(--graphite); margin: 0 0 12px; font-weight: 600; }
.bg .it { margin-bottom: 18px; }
.bg .it b { display: block; font-size: 17px; line-height: 1.4; }
.bg .it span { display: block; color: var(--graphite); font-size: 14px; }
.bg .it p { margin: 4px 0 0; font-size: 14px; }
.skills { display: flex; flex-wrap: wrap; gap: 6px; }
.skills span { border: 1px solid var(--rule); background: var(--paper); border-radius: 6px; padding: 3px 10px; font-size: 14px; }
@media (max-width: 860px) { .bg { grid-template-columns: 1fr; gap: 8px; } }
.about { margin-top: 40px; font-size: clamp(18px, 2vw, 21px); line-height: 1.75; max-width: 38em; }

/* 联系 */
.contact { padding: 88px 0 120px; }
.contact h2 { font-size: clamp(32px, 5vw, 56px); line-height: 1.15; margin: 0 0 18px; max-width: 14em; }
.contact .mail { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; font-family: var(--latin), var(--cn); font-size: clamp(20px, 2.6vw, 28px); font-weight: 600; margin-bottom: 22px; word-break: break-all; }
.contact .mail a { color: var(--ink); text-decoration-thickness: 2px; text-decoration-color: var(--hl); }
footer { border-top: 1px solid var(--rule); padding: 20px 0 40px; color: var(--graphite); font-size: 13px; }
footer .wrap { display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: space-between; }

/* ---------- AI 分身面板 ---------- */
.agent {
  position: fixed; z-index: 50; top: 0; right: 0; bottom: 0; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); width: min(420px, 100vw);
  background: var(--paper); border-left: 1px solid var(--rule); display: flex; flex-direction: column;
  box-shadow: -20px 0 50px -30px color-mix(in srgb, var(--ink) 60%, transparent);
  transform: translateX(100%); visibility: hidden; transition: transform .35s cubic-bezier(.2, .8, .2, 1), visibility 0s .35s;
}
.agent.open { transform: none; visibility: visible; transition: transform .35s cubic-bezier(.2, .8, .2, 1); }
@media (prefers-reduced-motion: reduce) { .agent, .agent.open { transition: none; } }
.agent header { display: flex; align-items: flex-start; gap: 12px; padding: 18px 18px 14px; border-bottom: 1px solid var(--rule); }
.agent header div { margin-right: auto; }
.agent header b { display: block; font-size: 17px; }
.agent header small { color: var(--graphite); font-size: 13px; }
.x { border: 1px solid var(--rule); background: none; border-radius: 8px; width: 34px; height: 34px; cursor: pointer; font-size: 18px; line-height: 1; flex: none; }
.msgs { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; overscroll-behavior: contain; }
.msg { max-width: 88%; padding: 10px 14px; border-radius: 14px; font-size: 15px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
.msg.bot { background: var(--board); align-self: flex-start; border-bottom-left-radius: 4px; }
.msg.me { background: var(--ink); color: var(--paper); align-self: flex-end; border-bottom-right-radius: 4px; }
.msg.typing { color: var(--graphite); }
.msg.typing::after { content: ''; display: inline-block; width: 1.2em; text-align: left; animation: dots 1.2s steps(4) infinite; }
@keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
.sugg { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 18px 12px; }
.sugg button { border: 1px solid var(--rule); background: var(--paper); border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; text-align: left; }
.sugg button:hover { border-color: var(--marker); color: var(--marker); }
.agent form { display: flex; gap: 8px; padding: 12px 14px 14px; border-top: 1px solid var(--rule); }
.agent input { flex: 1; min-width: 0; border: 1.5px solid var(--rule); border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 15px; background: var(--board); color: var(--ink); }
.agent input:focus { outline: none; border-color: var(--marker); }
.agent form button { border: 0; background: var(--marker); color: #fff; border-radius: 10px; padding: 0 16px; font-weight: 600; cursor: pointer; }
.agent form button:disabled { opacity: .5; cursor: default; }
.scrim { position: fixed; inset: 0; z-index: 45; background: rgba(10, 16, 30, .35); opacity: 0; pointer-events: none; transition: opacity .3s; }
.scrim.on { opacity: 1; pointer-events: auto; }
@media (min-width: 1280px) { .scrim.on { opacity: 0; pointer-events: none; } }
.fab { position: fixed; right: 20px; bottom: 20px; z-index: 40; box-shadow: 0 10px 30px -10px color-mix(in srgb, var(--ink) 70%, transparent); padding: 12px 18px 12px 14px; font-size: 15px;
  opacity: 0; translate: 0 12px; pointer-events: none; transition: opacity .25s, translate .25s; }
.fab.on { opacity: 1; translate: 0 0; pointer-events: auto; }
.empty { padding: 120px 0; }

/* ---------- ① 你好，我是 ---------- */
.intro { padding: 56px 0 40px; }
.intro .wrap { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 48px; align-items: center; }
.intro .hi-cn { margin: 0; color: var(--graphite); font-size: 15px; display: flex; align-items: center; gap: 10px; }
.intro .hi-cn::before { content: ''; width: 32px; height: 2px; background: var(--marker); }
.intro .hi { font-family: 'Caveat', 'Segoe Print', 'Bradley Hand', cursive; font-weight: 700; font-size: clamp(34px, 4.6vw, 52px); color: var(--marker); margin: 6px 0 -4px; line-height: 1.1; rotate: -2deg; transform-origin: left; }
.intro h1 { font-size: clamp(64px, 10vw, 120px); line-height: 1; margin: 0 0 18px; letter-spacing: .02em; font-weight: 800; }
.intro h1 .en { display: block; font-family: var(--latin); font-stretch: 125%; font-weight: 300; font-size: .22em; letter-spacing: .05em; color: var(--graphite); margin-top: 14px; }
.intro .tags { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin: 0 0 14px; font-size: clamp(19px, 2.2vw, 24px); font-weight: 700; }
.intro .tags i { font-style: normal; color: var(--rule); font-weight: 300; }
.intro .lead { color: var(--graphite); max-width: 34em; margin: 0 0 26px; }
.btn.ghost { border-color: transparent; color: var(--marker); }
.intro .down { display: inline-flex; align-items: center; gap: 8px; margin-top: 34px; color: var(--graphite); font-size: 14px; text-decoration: none; }
.intro .down::before { content: '↓'; font-family: var(--latin); }
/* 头像卡：手绘描边的纸，用胶带贴在白板上 */
.portrait { position: relative; margin: 0; justify-self: center; width: min(360px, 100%); padding: 22px 22px 14px; background: var(--paper);
  border: 2px solid var(--ink); border-radius: 255px 14px 225px 14px / 14px 225px 14px 255px; rotate: 2deg;
  box-shadow: 8px 10px 0 -2px color-mix(in srgb, var(--ink) 14%, transparent); }
.portrait .tape { position: absolute; top: -14px; left: 50%; width: 110px; height: 28px; translate: -50% 0; rotate: -3deg; background: color-mix(in srgb, var(--hl) 55%, transparent); }
.portrait svg { display: block; width: 100%; height: auto; }
.portrait figcaption { text-align: center; color: var(--graphite); font-size: 13px; margin-top: 4px; }
.portrait .n2 { fill: #ffe0d6; } .portrait .t2 { fill: #5c1d0c; }
.portrait .n3 { fill: #d9f0ff; } .portrait .t3 { fill: #0c3a5c; }

@media (max-width: 860px) { .intro .wrap { grid-template-columns: 1fr; gap: 36px; } .portrait { width: min(300px, 86%); } .intro { padding-top: 32px; } }

/* ---------- ② 关于我 ---------- */
.sec-h .hand { font-size: 15px; }
.sec-h .hand::before { content: '— '; }
.about-grid { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 36px; align-items: start; }
.sheet { background: var(--paper); border: 2px solid var(--ink); padding: 30px 34px; rotate: -.6deg; font-size: 16.5px; line-height: 1.95;
  border-radius: 14px 225px 14px 255px / 255px 14px 225px 14px; box-shadow: 7px 8px 0 -2px color-mix(in srgb, var(--ink) 14%, transparent); }
.sheet p { margin: 0 0 14px; max-width: 34em; }
.sheet b { font-weight: 700; background: linear-gradient(transparent 62%, color-mix(in srgb, var(--hl) 60%, transparent) 62%); }
.sheet blockquote { margin: 18px 0 0; padding: 12px 18px; border-left: 3px solid var(--marker); background: var(--marker-soft); border-radius: 0 8px 8px 0; font-weight: 600; }
.facts { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.facts li { display: flex; align-items: center; gap: 14px; background: var(--paper); border: 1.5px solid var(--rule); padding: 14px 16px; rotate: var(--r, 0deg);
  border-radius: 225px 12px 255px 12px / 12px 255px 12px 225px; }
.facts .ic { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--marker-soft); color: var(--marker); }
.facts .ic svg { width: 20px; height: 20px; }
.facts small { display: block; color: var(--graphite); font-size: 12px; }
.facts b { display: block; font-size: 15px; line-height: 1.45; }
@media (max-width: 860px) { .about-grid { grid-template-columns: 1fr; } .sheet { padding: 22px 20px; rotate: 0deg; } }
@media (prefers-reduced-motion: reduce) { .intro .hi, .portrait, .sheet, .facts li { rotate: none; } }

/* 原首屏改成白板分区：标题用 h2 */
#board-sec { padding-top: 56px; }
#board-sec .headline { font-size: clamp(26px, 3vw, 34px); line-height: 1.35; margin: 0 0 14px; max-width: 14em; text-wrap: balance; }
#board-sec .headline span { display: inline-block; }

/* ---------- 项目卡片：封面可点进详情 ---------- */
a.media { display: block; background: #f3f5f8; border: 1.5px solid var(--rule); }
a.media img { object-fit: cover; object-position: top center; transition: scale .4s; }
a.media:hover img { scale: 1.02; }

/* ---------- 项目详情页：Notion 风格的白纸文档 ---------- */
.detail { background: var(--paper); min-height: 100vh; padding-bottom: 80px; --dg: #f7f6f3; --dline: #e9e9e7; --dtext: #37352f; --dmute: #787774; }
.dcover { height: clamp(150px, 26vw, 280px); overflow: hidden; background: var(--marker-soft); border-bottom: 1px solid var(--dline); }
.dcover img { width: 100%; height: 100%; object-fit: cover; object-position: center 18%; }
.dcover.plain { background: linear-gradient(135deg, var(--marker-soft), #fff7c2); display: grid; place-items: center; }
.dpat { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 14px; max-width: 760px; padding: 0 20px; }
.dpat span { background: var(--note); color: var(--note-ink); padding: 6px 12px; font-weight: 600; font-size: 14px; box-shadow: 0 6px 12px -8px rgba(0,0,0,.35); }
.dpat span:nth-child(odd) { rotate: -2deg; } .dpat span:nth-child(even) { rotate: 1.5deg; }
.dwrap { display: grid; grid-template-columns: minmax(0, 760px) 200px; gap: 56px; justify-content: center; }
.doc { min-width: 0; color: var(--dtext); font-size: 16px; line-height: 1.75; }
.dback { display: inline-block; margin: 18px 0 0; font-size: 14px; color: var(--dmute); text-decoration: none; padding: 4px 8px; margin-left: -8px; border-radius: 6px; }
.dback:hover { background: var(--dg); color: var(--dtext); }
.dicon { width: 72px; height: 72px; margin-top: -2px; display: grid; place-items: center; border-radius: 14px; background: var(--paper); border: 2px solid var(--ink);
  font: 800 28px/1 var(--latin); color: var(--marker); box-shadow: 4px 5px 0 -1px color-mix(in srgb, var(--ink) 14%, transparent); position: relative; top: -2px; margin-top: 18px; }
.doc h1 { font-size: clamp(30px, 4.4vw, 42px); line-height: 1.2; margin: 18px 0 8px; color: var(--ink); }
.dlede { font-size: 18px; color: var(--dmute); margin: 0 0 22px; }
.doc h2 { font-size: 23px; line-height: 1.35; margin: 44px 0 10px; color: var(--ink); padding-bottom: 6px; border-bottom: 1px solid var(--dline); scroll-margin-top: 80px; }
.doc p { margin: 8px 0; }
.doc b { font-weight: 700; color: var(--ink); }
.props { margin: 0 0 24px; padding: 6px 0; border-top: 1px solid var(--dline); border-bottom: 1px solid var(--dline); }
.props div { display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 5px 0; font-size: 14.5px; }
.props dt { color: var(--dmute); }
.props dd { margin: 0; }
.callout { display: flex; gap: 12px; background: var(--dg); border-radius: 6px; padding: 14px 16px; margin: 16px 0; }
.callout .ci { color: var(--marker); flex: none; line-height: 1.75; }
.callout p { margin: 0; }
.dl { margin: 8px 0; padding-left: 1.3em; }
.dl li { margin: 4px 0; }
.dl li::marker { color: var(--dmute); }
.dstats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 16px 0; }
.dstats div { border: 1px solid var(--dline); border-radius: 8px; padding: 14px 14px 12px; }
.dstats b { display: block; font: 800 28px/1.15 var(--font); color: var(--marker); font-variant-numeric: tabular-nums; }
.dstats span { display: block; font-size: 13.5px; color: var(--dmute); margin-top: 4px; line-height: 1.5; }
.bars { margin: 18px 0; padding: 16px 18px; border: 1px solid var(--dline); border-radius: 8px; }
.bars figcaption { font-weight: 700; font-size: 15px; margin-bottom: 8px; color: var(--ink); }
.bar { display: grid; grid-template-columns: minmax(0, 13em) minmax(0, 1fr) 4em; gap: 12px; align-items: center; font-size: 14px; padding: 4px 0; }
.bar .tr { height: 12px; background: var(--dg); border-radius: 6px; overflow: hidden; }
.bar .tr i { display: block; height: 100%; background: #c4cad3; border-radius: 6px; }
.bar.on .tr i { background: var(--marker); }
.bar .bv { text-align: right; font-variant-numeric: tabular-nums; color: var(--dmute); }
.bar.on .bv { color: var(--ink); font-weight: 700; }
.note-s { font-size: 13.5px; color: var(--dmute); margin: 10px 0 0 !important; }
.tbl { overflow-x: auto; margin: 16px 0; border: 1px solid var(--dline); border-radius: 8px; }
.tbl table { border-collapse: collapse; width: 100%; font-size: 14px; line-height: 1.6; min-width: 520px; }
.tbl th, .tbl td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px solid var(--dline); }
.tbl thead th { background: var(--dg); color: var(--dmute); font-weight: 600; font-size: 13px; white-space: nowrap; }
.tbl tbody th { font-weight: 600; color: var(--ink); min-width: 6.5em; }
.tbl tr:last-child > * { border-bottom: 0; }
.tbl td + td, .tbl th + td, .tbl th + th { border-left: 1px solid var(--dline); }
/* 四象限 */
.quad { margin: 20px 0; display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto auto auto; gap: 6px 10px; }
.quad .qy { grid-row: 1; grid-column: 1; writing-mode: vertical-rl; display: flex; justify-content: space-between; font-size: 12.5px; color: var(--dmute); text-orientation: upright; letter-spacing: 2px; }
.quad .qbox { grid-row: 1; grid-column: 2; position: relative; display: grid; grid-template-columns: 1fr 1fr; border: 1.5px solid var(--ink); border-radius: 8px; overflow: hidden; min-height: 380px; }
.quad .qc { padding: 10px 12px; border-color: var(--dline); border-style: solid; border-width: 0; }
.quad .q0 { border-right-width: 1px; border-bottom-width: 1px; background: color-mix(in srgb, var(--marker-soft) 60%, #fff); }
.quad .q1 { border-bottom-width: 1px; } .quad .q2 { border-right-width: 1px; }
.quad .q3 { background: var(--dg); }
.quad .qt { font-size: 13px; font-weight: 700; color: var(--dmute); }
.quad .q0 .qt { color: var(--marker); }
.quad .qx { grid-row: 2; grid-column: 2; display: flex; justify-content: space-between; font-size: 12.5px; color: var(--dmute); }
.quad figcaption { grid-row: 3; grid-column: 1 / -1; font-size: 13.5px; color: var(--dmute); margin-top: 6px; }
.quad .qlist { display: none; }
.qdots { position: absolute; inset: 34px 22px 18px; pointer-events: none; }
.qd { position: absolute; translate: -50% 50%; white-space: nowrap; background: var(--paper); border: 1.5px solid var(--ink); border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 600; color: var(--ink); box-shadow: 0 2px 0 var(--ink); }
.qd em, .qlist em { font-style: normal; font-size: 11px; font-weight: 700; margin-left: 6px; color: var(--marker); }
.quad.only .qbox { min-height: 0; }
.quad.only .qc { padding: 18px 16px; min-height: 120px; display: flex; align-items: center; }
.quad.only .qt { font-size: 15px; color: var(--dtext); font-weight: 600; line-height: 1.55; }
.quad.only .q2 { background: color-mix(in srgb, var(--hl) 28%, #fff); }
.quad.only .q2 .qt, .quad.only .q0 .qt { color: var(--ink); }
.quad.only .q0 { background: color-mix(in srgb, var(--marker-soft) 60%, #fff); }
.quad.only .q1 { background: var(--dg); } .quad.only .q1 .qt { color: var(--dmute); }
.quad.only .q3 { background: #fdecec; }
@media (max-width: 640px) {
  .quad .qbox { min-height: 0; }
  .qdots { display: none; }
  .quad .qlist { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin: 8px 0 0; padding: 0; }
  .quad .qlist li { background: var(--paper); border: 1px solid var(--ink); border-radius: 999px; padding: 2px 8px; font-size: 12.5px; font-weight: 600; }
  .quad .qlist em { margin-left: 4px; }
  .quad.only .qc { min-height: 0; padding: 12px; }
  .quad.only .qt { font-size: 14px; }
}
/* 循环 */
.loop { margin: 20px 0; padding: 18px; border: 1px solid var(--dline); border-radius: 8px; }
.loop ol { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 0; }
.loop li { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; background: var(--note); color: var(--note-ink); padding: 8px 14px; border-radius: 6px; }
.loop li + li { margin-left: 30px; position: relative; }
.loop li + li::before { content: '→'; position: absolute; left: -22px; font-family: var(--latin); color: var(--dmute); font-weight: 400; }
.loop .n { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--paper); font: 700 12px/1 var(--latin); color: var(--note-ink); }
.loop .back { margin-top: 12px; font-size: 13.5px; color: var(--marker); font-weight: 600; }
.loop figcaption { font-size: 13.5px; color: var(--dmute); margin-top: 6px; }
/* 图片 */
.gal { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 16px 0; }
.gal figure, .dimg { margin: 0; }
.dimg { margin: 16px 0; }
.dimg.narrow { max-width: 560px; }
.zoom { display: block; width: 100%; padding: 0; border: 1px solid var(--dline); border-radius: 8px; overflow: hidden; background: var(--dg); cursor: zoom-in; }
.zoom img { display: block; width: 100%; height: auto; }
.gal figcaption, .dimg figcaption { font-size: 13px; color: var(--dmute); margin-top: 6px; line-height: 1.5; }
@media (max-width: 560px) { .gal { grid-template-columns: 1fr; } .bar { grid-template-columns: 1fr 3.4em; } .bar .bl { grid-column: 1 / -1; } }
.lb { position: fixed; inset: 0; z-index: 80; background: rgba(15, 20, 30, .88); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 16px 24px; cursor: zoom-out; }
.lb img { max-width: 100%; max-height: calc(100vh - 120px); object-fit: contain; border-radius: 6px; background: #fff; }
.lb p { color: #fff; font-size: 14px; margin: 12px 0 0; text-align: center; }
.lb .x { position: absolute; top: 10px; right: 14px; background: none; border: 0; color: #fff; font-size: 32px; line-height: 1; cursor: pointer; }
/* Figma 嵌入 */
.embed { border: 1px solid var(--dline); border-radius: 8px; padding: 16px; margin: 16px 0; background: var(--dg); }
.em-h b { display: block; color: var(--ink); }
.em-h span { font-size: 13.5px; color: var(--dmute); }
.embed .acts { margin-top: 12px; }
.embed iframe { display: block; width: 100%; height: min(70vh, 640px); border: 1px solid var(--dline); border-radius: 6px; margin-top: 12px; background: #fff; }
/* 折叠块 */
.tg { margin: 4px 0; }
.tg summary { cursor: pointer; font-weight: 600; padding: 6px 4px; border-radius: 6px; list-style: none; display: flex; gap: 8px; }
.tg summary::-webkit-details-marker { display: none; }
.tg summary::before { content: '▸'; color: var(--dmute); transition: rotate .15s; display: inline-block; }
.tg[open] summary::before { rotate: 90deg; }
.tg summary:hover { background: var(--dg); }
.tg > div { padding: 0 0 6px 26px; }
/* 页脚 + 目录 */
.dfoot { margin-top: 48px; padding-top: 22px; border-top: 1px solid var(--dline); }
.pn { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 22px; }
.pn a { border: 1px solid var(--dline); border-radius: 8px; padding: 12px 14px; text-decoration: none; color: var(--ink); font-weight: 600; font-size: 15px; }
.pn a:hover { background: var(--dg); }
.pn small { display: block; color: var(--dmute); font-weight: 400; font-size: 12.5px; }
.pn .nx { text-align: right; grid-column: 2; }
.toc { position: sticky; top: 88px; align-self: start; margin-top: 120px; display: flex; flex-direction: column; gap: 2px; font-size: 13.5px; }
.toc b { font-size: 12px; color: var(--dmute); font-weight: 600; margin-bottom: 6px; }
.toc a { color: var(--dmute); text-decoration: none; padding: 3px 8px; border-left: 2px solid var(--dline); }
.toc a:hover { color: var(--ink); border-left-color: var(--marker); }
@media (max-width: 1100px) { .dwrap { grid-template-columns: minmax(0, 760px); } .toc { display: none; } }
@media (max-width: 640px) { .props div { grid-template-columns: 72px 1fr; } .doc h2 { font-size: 20px; margin-top: 36px; } .dlede { font-size: 16.5px; } .pn { grid-template-columns: 1fr; } .pn .nx { grid-column: 1; } }
/* 页面拆解：截图 + 标注 */
.scr { margin: 16px 0; display: grid; gap: 18px; }
.scr-i { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 28px; align-items: start; padding: 20px; border: 1px solid var(--dline); border-radius: 10px; }
.scr-i.two { grid-template-columns: 400px minmax(0, 1fr); }
.scr-img { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 10px; }
.scr-img .zoom { border-radius: 14px; border-color: #d9dee5; box-shadow: 0 10px 24px -16px rgba(21, 33, 59, .5); }
.scr-tag { font: 600 12px/1 var(--latin), var(--cn); color: var(--marker); letter-spacing: .04em; }
.scr-t h3 { font-size: 20px; margin: 8px 0 10px; color: var(--ink); }
.scr-t ol { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 10px; }
.scr-t li { counter-increment: s; display: grid; grid-template-columns: 22px 1fr; gap: 10px; font-size: 15px; line-height: 1.65; }
.scr-t li::before { content: counter(s); display: grid; place-items: center; width: 22px; height: 22px; margin-top: 2px; border-radius: 50%; background: var(--marker-soft); color: var(--marker); font: 700 12px/1 var(--latin); }
@media (max-width: 720px) {
  .scr-i, .scr-i.two { grid-template-columns: 1fr; gap: 16px; padding: 14px; }
  .scr-img { max-width: 230px; } .scr-i.two .scr-img { max-width: 400px; }
}
/* 横屏截图（网页产品）：图在上，说明在下 */
.scr-i.wide, .scr-i.wide.two { grid-template-columns: 1fr; gap: 18px; }
.scr-i.wide .scr-img { max-width: none; }
.scr-i.wide .zoom { border-radius: 8px; background: var(--dg); }
.scr-i.wide.two .scr-img { align-items: start; }
.scr-i.wide .scr-t ol { columns: auto; }
@media (min-width: 900px) { .scr-i.wide .scr-t { display: grid; grid-template-columns: 180px 1fr; gap: 0 24px; } .scr-i.wide .scr-t h3 { margin-top: 6px; } .scr-i.wide .scr-tag { grid-column: 1; } .scr-i.wide .scr-t h3 { grid-column: 1; } .scr-i.wide .scr-t ol { grid-column: 2; grid-row: 1 / span 2; } }

/* ---------- AI 分身「小莫」：便利贴小玩偶 ---------- */
#buddy-sym .b-shadow { fill: color-mix(in srgb, var(--ink) 18%, transparent); }
#buddy-sym .b-note { fill: var(--hl); stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; }
#buddy-sym .b-fold { fill: #f0c92a; stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; }
#buddy-sym .b-tape { fill: color-mix(in srgb, var(--marker) 30%, #fff); opacity: .9; }
#buddy-sym .eye ellipse { fill: var(--ink); }
#buddy-sym .glint { fill: #fff; }
#buddy-sym .b-cheek { fill: #ff9aa8; opacity: .75; }
#buddy-sym .b-mouth, #buddy-sym .b-arm { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }
#buddy-sym .b-lines { stroke: color-mix(in srgb, var(--ink) 30%, transparent); stroke-width: 2.5; stroke-linecap: round; }
#buddy-sym .b-eyes { transform-origin: 60px 56px; animation: blink 5s infinite; }
#buddy-sym .b-arm-r { transform-origin: 98px 66px; animation: wave-idle 7s ease-in-out infinite; }
@keyframes wave-idle { 0%, 82%, 100% { transform: rotate(0); } 86% { transform: rotate(-24deg); } 90% { transform: rotate(8deg); } 94% { transform: rotate(-18deg); } }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes wave { 0%, 100% { transform: rotate(0); } 30% { transform: rotate(-22deg); } 60% { transform: rotate(10deg); } }
@keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-4px) rotate(-4deg); } }

.buddy-wrap { position: fixed; z-index: 40; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: flex-end; gap: 6px; pointer-events: none; }
.buddy { pointer-events: auto; position: relative; width: 100px; height: 100px; padding: 0; border: 0; background: none; cursor: pointer; transition: transform .25s, opacity .25s; }
.buddy svg { width: 100%; height: 100%; overflow: visible; animation: bob 3.2s ease-in-out infinite; filter: drop-shadow(0 6px 10px color-mix(in srgb, var(--ink) 22%, transparent)); }
.buddy:hover svg, .buddy:focus-visible svg { animation: hop .6s ease-in-out; }
.buddy:hover { transform: rotate(-4deg) scale(1.04); }
.buddy:focus-visible { outline: 3px solid var(--marker); outline-offset: 4px; border-radius: 16px; }
.buddy-tag { position: absolute; left: 50%; bottom: -4px; translate: -50% 0; white-space: nowrap; background: var(--ink); color: #fff; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; box-shadow: 0 4px 10px -4px rgba(0,0,0,.4); }
.buddy-bubble { pointer-events: auto; position: relative; max-width: 220px; margin-bottom: 52px; background: var(--paper); border: 2px solid var(--ink); border-radius: 14px 14px 4px 14px; padding: 10px 28px 10px 12px; font-size: 13.5px; line-height: 1.55; box-shadow: 4px 5px 0 -1px color-mix(in srgb, var(--ink) 14%, transparent);
  opacity: 0; translate: 8px 6px; transition: opacity .3s, translate .3s; visibility: hidden; }
.buddy-bubble.on { opacity: 1; translate: 0 0; visibility: visible; }
.buddy-bubble p { margin: 0; }
.buddy-bubble .x { position: absolute; top: 2px; right: 4px; border: 0; background: none; font-size: 18px; line-height: 1; padding: 4px; cursor: pointer; color: var(--graphite); }
body.chatting .buddy-wrap { opacity: 0; pointer-events: none; transform: translateY(16px); transition: opacity .2s, transform .2s; }
body.chatting .buddy-wrap * { pointer-events: none; }
.buddy-mini { flex: none; width: 44px; height: 44px; margin: -4px 2px -4px -4px; }
.buddy-mini svg { width: 100%; height: 100%; overflow: visible; }
.buddy-mini.think svg { animation: hop .7s ease-in-out infinite; }
.msg.typing { min-width: 54px; min-height: 40px; }
.msg.typing::after { content: ''; display: inline-block; width: 26px; height: 8px; background: radial-gradient(circle, var(--graphite) 3px, transparent 3.5px) 0 50% / 9px 8px repeat-x; animation: dotpulse 1s ease-in-out infinite; vertical-align: middle; }
@keyframes dotpulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
@media (max-width: 640px) { .buddy { width: 72px; height: 72px; } .buddy-bubble { max-width: 190px; margin-bottom: 44px; } }
@media (prefers-reduced-motion: reduce) { .buddy svg, #buddy-sym .b-eyes, #buddy-sym .b-arm-r, .buddy-mini.think svg { animation: none; } .buddy, .buddy-bubble { transition: none; } }

</style>
</head>

        <ellipse class="b-cheek" cx="36" cy="68" rx="6" ry="3.5"/><ellipse class="b-cheek" cx="84" cy="68" rx="6" ry="3.5"/>

<div class="buddy-wrap">
  <div class="buddy-bubble" id="buddyBubble" role="status"><p>嗨，我是<b>小莫</b>，晋睿的 AI 分身。点我问他的经历和项目。</p><button class="x" id="buddyBubbleX" type="button" aria-label="关闭提示">×</button></div>

<script src="data.js"></script>
<script src="agent.js"></script>
<script>

// 个人主页：渲染 /api/public/:slug，白板交互 + AI 分身
(() => {
  const slug = decodeURIComponent(location.pathname.split('/').filter(Boolean)[1] || '');
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const safeUrl = (u) => (/^(https?:|mailto:|media\/)/i.test(u || '') ? u : '');
  const ym = (d) => String(d || '').replace(/^(\d{4})-(\d{2}).*/, '$1.$2');
  const span = (a, b) => (a ? (b && ym(a) === ym(b) ? ym(a) : `${ym(a)} – ${b ? ym(b) : '至今'}`) : ym(b));
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };


  const DATA = window.DATA;

  // 只给「带量词的数字」划荧光笔：10 万+、500+、37%、30 分钟……年份和热线号码不划
  const NUM = /(?<![\d\-—–])(\d+(?:\.\d+)?\s*(?:万\s*\+?|千\s*\+?|\+|%|\s*(?:个|条|份|名|项(?!目)|次|例|轮|分钟|人次|倍)))/g;
  const hl = (t) => esc(t).replace(NUM, '<mark class="hl">$1</mark>');

  // 描述按行拆：「小标题：内容」
  const lines = (d) => String(d || '').split(/\n+/).map((l) => l.trim()).filter(Boolean).map((l) => {
    const m = l.match(/^([^：:]{2,24})[：:]\s*(.+)$/);
    return m ? { head: m[1], text: m[2] } : { head: '', text: l };
  });
  const isBg = (x) => /背景|简介|概述/.test(x.head);

  // ---------- 方法：从经历和项目里自动找证据 ----------
  const STAGES = [
    { name: '发现', def: '先弄清楚用户真正卡在哪', kws: [['用户调研', /用户调研|需求调研|调研/], ['用户访谈', /访谈/], ['问卷', /问卷/], ['NLP 分词', /NLP|分词/], ['词频分析', /词频/], ['卡片分类法', /卡片分类/], ['Say-Do-Make', /say-do-make/i], ['行为路径', /行为路径/], ['数据埋点', /埋点/], ['日志清洗', /日志|清洗/], ['痛点挖掘', /痛点/], ['竞品分析', /竞品/]] },
    { name: '判断', def: '决定先做什么、不做什么', kws: [['Kano 模型', /kano|卡诺/i], ['重要-紧急四象限', /四象限/], ['优先级', /优先级/], ['排期', /排期/], ['功能规划', /功能规划|产品规划/], ['数值设计', /数值/], ['机制设计', /机制|博弈/], ['RICE 评估', /RICE/i]] },
    { name: '设计', def: '把方案画成能讨论的原型', kws: [['高保真原型', /高保真|原型/], ['Figma', /figma/i], ['墨刀', /墨刀/], ['信息架构', /信息架构/], ['交互规范', /交互流程|交互规范|关键交互|交互路径/], ['数据可视化', /可视化|仪表盘|热力图/], ['软硬件联调', /软硬件|联调/], ['异常兜底', /兜底/], ['多 Agent 编排', /agent/i], ['工作流配置', /工作流/]] },
    { name: '验证', def: '用测试和数据确认它真的有用', kws: [['可用性测试', /可用性测试/], ['有声思考法', /有声思考/], ['满意度', /满意度/], ['场景验收', /验收/], ['误报回流训练', /误报|模型迭代/], ['缺陷管理', /缺陷/], ['功能测试', /功能测试/], ['实测数据', /实测|预警|告警/], ['灰度发布', /灰度/], ['任务完成率', /完成率/]] },
  ];
  function evidence(p) {
    const sents = [];
    const add = (src, d) => lines(d).filter((l) => !isBg(l)).forEach((l) => l.text.split(/[；;]/).map((t) => t.trim().replace(/[。.]$/, '')).filter((t) => t.length > 8).forEach((t) => sents.push({ src, text: t, ord: sents.length })));
    [...(p.experience || []), ...(p.work || [])].forEach((e) => add(e.company, e.description));
    (p.projects || []).forEach((x) => add(x.name, x.description));
    const all = sents.map((s) => s.text).join('\n');
    return STAGES.map((st, si) => {
      const kws = st.kws.filter(([, re]) => re.test(all)).map(([label, re]) => ({ label, re, stage: si }));
      const scored = sents.map((s) => {
        const hits = kws.filter((k) => k.re.test(s.text)).length;
        const nums = (s.text.match(NUM) || []).length;
        return { ...s, score: hits * 3 + nums, hits };
      }).filter((s) => s.hits).sort((a, b) => b.score - a.score);
      const pick = [], seen = new Set();
      for (const s of scored) { if (pick.length >= 3) break; if (seen.has(s.src) && scored.some((o) => !seen.has(o.src) && !pick.includes(o) && o.score >= s.score - 2)) continue; pick.push(s); seen.add(s.src); }
      // 选出来的按简历顺序排：先实习（按时间），再项目
      pick.sort((a, b) => a.ord - b.ord);
      return { ...st, kws, items: pick, sents: scored };
    });
  }

  // ---------- 渲染 ----------
  function render(p) {
    const st = evidence(p);
    const exp = [...(p.experience || []), ...(p.work || [])];
    const sec = [];
    const nav = [];

    const role = [p.education?.[0] && `${p.education[0].school}${p.education[0].major ? p.education[0].major : ''}${p.education[0].degree || ''}${!p.education[0].endDate || p.education[0].endDate >= new Date().toISOString().slice(0, 7) ? '在读' : ''}`, p.intent?.position && `求职方向：${p.intent.position}`].filter(Boolean).join('，');
    const hasBoard = st.reduce((n, s) => n + s.kws.length, 0) >= 6;
    // ① 你好，我是：手写招呼 + 名字 + 贴在白板上的线描头像卡
    sec.push(`
    <section class="intro" id="top"><div class="wrap">
      <div class="intro-text">
        <p class="hi-cn">你好，我是</p>
        <p class="hi" lang="en" aria-hidden="true">Hello, my name is</p>
        <h1>${esc(p.name)}${p.nameEn ? `<span class="en">${esc(p.nameEn)}</span>` : ''}</h1>
        ${(p.tags || []).length ? `<p class="tags">${p.tags.map((t) => `<span>${esc(t)}</span>`).join('<i aria-hidden="true">/</i>')}</p>` : role ? `<p class="tags"><span>${esc(role)}</span></p>` : ''}
        ${p.intro || p.bio ? `<p class="lead">${esc(p.intro || p.bio)}</p>` : ''}
        <div class="cta">
          ${(p.projects || []).length ? '<a class="btn solid" href="#work">看看我做过什么</a>' : ''}
          <a class="btn" href="#contact">与我联系</a>
          <button class="btn ghost" data-open-agent>问 AI 分身</button>
        </div>
        <a class="down" href="#about-me">往下看，白板上还有很多</a>
      </div>
      <figure class="portrait" aria-label="${esc(p.name)}的线描头像">
        <span class="tape" aria-hidden="true"></span>
        <svg viewBox="0 0 240 260" aria-hidden="true">
          <g fill="none" stroke="var(--ink)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
            <ellipse cx="124" cy="104" rx="40" ry="44" fill="var(--paper)" />
            <path d="M86 92 C96 70 118 64 138 70 C152 74 160 84 163 96 C150 86 136 84 122 80 C108 82 96 86 86 92 Z" fill="var(--ink)" />
            <path d="M108 104 q4 -4 8 0" /><path d="M134 104 q4 -4 8 0" />
            <path d="M114 122 q10 9 20 0" />
            <path d="M52 236 C54 188 84 160 124 160 C164 160 194 188 196 236" />
            <path d="M124 160 v76" stroke="var(--marker)" stroke-width="2.4" />
          </g>
          <g font-family="var(--cn)" font-size="12" font-weight="600">
            <rect x="160" y="172" width="64" height="30" rx="2" fill="var(--note)" transform="rotate(6 192 187)" /><text x="168" y="192" fill="var(--note-ink)" transform="rotate(6 192 187)">用户调研</text>
            <rect x="14" y="150" width="58" height="30" rx="2" class="n2" transform="rotate(-7 43 165)" /><text x="22" y="170" class="t2" transform="rotate(-7 43 165)">原型</text>
            <rect x="170" y="22" width="54" height="30" rx="2" class="n3" transform="rotate(-4 197 37)" /><text x="178" y="42" class="t3" transform="rotate(-4 197 37)">验证</text>
          </g>
        </svg>
        <figcaption>${esc(p.name)}，正在白板前整理便利贴</figcaption>
      </figure>
    </div></section>`);

    // ② 关于我：写在纸上的自我介绍 + 右侧几张信息卡
    const md = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    const aboutParas = (p.about || []).length ? p.about : (p.summary ? [p.summary] : []);
    const ICONS = {
      cap: '<path d="M3 9l9-4 9 4-9 4z"/><path d="M7 11v4c3 2 7 2 10 0v-4"/>',
      search: '<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>',
      compass: '<circle cx="12" cy="12" r="8"/><path d="M15 9l-2 5-4 1 2-5z"/>',
      chat: '<path d="M5 18l1-3.5A7 7 0 1 1 9 17z"/>',
      star: '<path d="M12 4l2.4 5 5.4.6-4 3.7 1.1 5.3L12 16l-4.9 2.6 1.1-5.3-4-3.7 5.4-.6z"/>',
    };
    if (aboutParas.length) {
      nav.push(['about-me', '关于我']);
      sec.push(`
      <section class="sec about-me" id="about-me"><div class="wrap">
        <div class="sec-h"><h2>关于我</h2><p class="hand">一张写在纸上的自我介绍</p></div>
        <div class="about-grid">
          <article class="sheet">
            ${aboutParas.map((t) => `<p>${md(t)}</p>`).join('')}
            ${p.quote ? `<blockquote>${esc(p.quote)}</blockquote>` : ''}
          </article>
          ${(p.facts || []).length ? `<ul class="facts">${p.facts.map((f, i) => `<li style="--r:${[-0.6, 0.5, -0.3, 0.7, -0.5, 0.4][i % 6]}deg"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[f.icon] || ICONS.star}</svg></span><span><small>${esc(f.k)}</small><b>${esc(f.v)}</b></span></li>`).join('')}</ul>` : ''}
        </div>
      </div></section>`);
    }

    // ③ 方法白板（原首屏）
    sec.push(`
    <section class="hero" id="board-sec"><div class="wrap${hasBoard ? '' : ' solo'}">
      <div>
        ${p.headline ? `<h2 class="headline">${p.headline.split(/(?<=[，,；;])/).map((c) => `<span>${esc(c)}</span>`).join('')}</h2>` : ''}
        ${p.bio ? `<p class="bio">${esc(p.bio)}</p>` : ''}
        <div class="cta"><button class="btn solid" data-open-agent>问问我的 AI 分身</button></div>
      </div>
      ${hasBoard ? `
      <div class="board drift" id="board" aria-label="方法白板：可拖动的便利贴，整理后按发现、判断、设计、验证四步归类">
        <div class="cols" aria-hidden="true">${st.map((s, i) => `<div><b>${i + 1} ${esc(s.name)}</b><small>${esc(s.def)}</small></div>`).join('')}</div>
        <div class="board-bar">
          <span class="hint" id="boardHint">这些是我简历里用到的方法。拖一拖，或者点「整理」。</span>
          <button class="chipbtn" id="motion" aria-pressed="false">暂停动效</button>
          <button class="chipbtn primary" id="sortBtn">整理成方法</button>
        </div>
      </div>` : ''}
    </div></section>`);

    if ((p.stats || []).length) sec.push(`
    <section class="stats ink-in" id="stats"><div class="wrap"><ul>${p.stats.map((s) => `<li><span class="n"><mark class="hl">${esc(s.n)}</mark></span><span class="l">${esc(s.l)}</span></li>`).join('')}</ul></div></section>`);

    const edu = p.education || [];
    const camp = [
      ...(p.papers || []).map((x) => ({ b: `《${x.title}》`, s: [x.journal, x.date].filter(Boolean).join('，'), d: x.description })),
      ...(p.leadership || []).map((x) => ({ b: x.org, s: x.title, d: x.description })),
      ...(p.awards || []).map((x) => ({ b: x.name, s: x.date || '', d: x.description })),
    ];
    const skills = [...(p.itSkills || []).map((s) => s.name), ...(p.certificates || []).map((c) => c.name)].filter(Boolean);
    const langs = (p.languages || []).map((l) => [l.language, l.level].filter(Boolean).join('：') + (l.proficiency ? `。${l.proficiency}` : ''));
    if (edu.length) {
      nav.push(['edu', '教育']);
      sec.push(`
      <section class="sec" id="edu"><div class="wrap">
        <div class="sec-h"><h2>教育背景</h2></div>
        <div class="edu">${edu.map((e) => `<div class="it">
          <div class="crest">${e.logo && safeUrl(e.logo) ? `<img src="${esc(e.logo)}" alt="${esc(e.school)}校徽" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'mono',textContent:this.dataset.m}))" data-m="${esc(e.short || e.school.slice(0, 2))}">` : `<span class="mono">${esc(e.short || e.school.slice(0, 2))}</span>`}</div>
          <div class="info"><span class="when">${esc(span(e.startDate, e.endDate))}</span><b>${esc(e.school)}</b>${e.badge ? `<span class="badge">${esc(e.badge)}</span>` : ''}<span class="deg">${esc([e.major, e.degree].filter(Boolean).join('，'))}</span>${e.courses ? `<p>主修：${esc(e.courses)}</p>` : ''}</div></div>`).join('')}</div>
      </div></section>`);
    }
    if (exp.length) {
      nav.push(['exp', '经历']);
      sec.push(`
      <section class="sec" id="exp"><div class="wrap">
        <div class="sec-h"><h2>实习经历</h2><p>${exp.length} 段经历，点开看具体做法和数据。</p></div>
        <ol class="tl" reversed>${exp.map((e, i) => {
          const ls = lines(e.description), bg = ls.find(isBg), rest = ls.filter((l) => l !== bg);
          return `<li>
            <div class="when">${esc(span(e.startDate, e.endDate))}</div>
            <div class="ink-in" id="e-${i}">
              <h3>${esc(e.company)}</h3><p class="title">${esc([e.title, e.department].filter(Boolean).join('，'))}</p>
              ${bg ? `<p class="lede">${hl(bg.text)}</p>` : ''}

        n.el.setPointerCapture(e.pointerId);
        const mv = (ev) => {
          const dx = ev.clientX - sx, dy = ev.clientY - sy;
          if (!moved && Math.hypot(dx, dy) < 5) return;
          if (!moved) { moved = true; closePop(); n.el.classList.add('dragging'); }
          pos(n, Math.max(0, Math.min(W() - n.el.offsetWidth, ox + dx)), Math.max(0, Math.min(H() - n.el.offsetHeight, oy + dy)), sorted ? W() / 4 - 12 : 0);
        };
        const up = () => { n.el.removeEventListener('pointermove', mv); n.el.removeEventListener('pointerup', up); n.el.removeEventListener('pointercancel', up); n.el.classList.remove('dragging'); if (moved) n.el.dataset.dragged = '1'; };
        n.el.addEventListener('pointermove', mv); n.el.addEventListener('pointerup', up); n.el.addEventListener('pointercancel', up);
      });
      n.el.addEventListener('click', () => {
        if (n.el.dataset.dragged) { delete n.el.dataset.dragged; return; }
        const was = n.el.classList.contains('lit');
        closePop();
        if (was) return;
        n.el.classList.add('lit');
        const hits = st[n.si].sents.filter((s) => n.re.test(s.text)).slice(0, 2).sort((a, b) => a.ord - b.ord);
        pop = document.createElement('div');
        pop.className = 'pop';
        pop.innerHTML = `<b>${esc(n.label)}　<span style="font-weight:400;color:var(--graphite)">${esc(st[n.si].name)}</span></b>${hits.map((h) => `<p>${hl(h.text)}<br><span class="src">${esc(h.src)}</span></p>`).join('')}
          <div class="row"><button class="linkish" data-ask="${esc(`他是怎么用「${n.label}」的？举个具体例子`)}">问 AI 具体怎么用</button><button class="chipbtn" data-closepop>关闭</button></div>`;
        el.append(pop);
        const w = W(), pw = pop.offsetWidth;
        pop.style.left = Math.max(12, Math.min(w - pw - 12, n.x + n.el.offsetWidth / 2 - pw / 2)) + 'px';
        const below = n.y + n.el.offsetHeight + 8;
        pop.style.top = (below + pop.offsetHeight < H() ? below : Math.max(8, n.y - pop.offsetHeight - 8)) + 'px';
        $('[data-closepop]', pop).onclick = closePop;
      });
    }
    // 先打散；进入视野后自动整理一次（页面里唯一一次自动的动画）
    scatter();
    if (reduce) sort();
    else {
      const io = new IntersectionObserver((es) => { if (es[0].isIntersecting) { io.disconnect(); setTimeout(() => !sorted && sort(), 1400); } }, { threshold: .6 });
      io.observe(el);
    }
    let rw = W();
    addEventListener('resize', () => { if (Math.abs(W() - rw) < 20) return; rw = W(); closePop(); sorted ? sort() : scatter(); });
  }

  // ---------- 其它交互 ----------
  function wire(st) {
    // 荧光笔：滚到时划上
    const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('inked'); io.unobserve(e.target); } }), { threshold: .4 });
    $$('.ink-in').forEach((x) => (reduce ? x.classList.add('inked') : io.observe(x)));

    // 方法关键词筛选
    $$('.kw').forEach((b) => b.onclick = () => {
      const step = b.closest('.step'), si = +step.dataset.stage, on = b.getAttribute('aria-pressed') !== 'true';
      $$('.kw', step).forEach((x) => x.setAttribute('aria-pressed', 'false'));
      const ul = $('ul', step);
      const s = st[si];
      const kw = s.kws.find((k) => k.label === b.dataset.kw);
      const items = on ? s.sents.filter((x) => kw.re.test(x.text)).slice(0, 3).sort((a, b) => a.ord - b.ord) : s.items;
      if (on) b.setAttribute('aria-pressed', 'true');
      ul.innerHTML = items.map((it) => `<li class="${on ? 'lit' : ''}">${hl(it.text)}<span class="src">${esc(it.src)}</span></li>`).join('');
    });

    // 视频：点封面播放
    $$('[data-play]').forEach((b) => b.onclick = () => { const v = $('video', b.parentElement); b.remove(); v.preload = 'auto'; v.play().catch(() => {}); });
    // 项目案例展开
    $$('[data-expand]').forEach((b) => b.onclick = () => {
      const box = b.closest('.ink-in'), open = b.getAttribute('aria-expanded') !== 'true';
      $$('[data-extra]', box).forEach((li) => (li.hidden = !open));
      b.setAttribute('aria-expanded', String(open)); b.textContent = open ? '收起' : '展开要点';
    });
    // 经历展开
    $$('[data-toggle]').forEach((b) => b.onclick = () => {
      const ul = b.previousElementSibling, open = ul.hidden;
      ul.hidden = !open; b.setAttribute('aria-expanded', String(open)); b.textContent = open ? '收起' : '展开具体做了什么';
    });
    $('#copyMail')?.addEventListener('click', async (e) => {
      const t = $('.mail a').textContent;
      try { await navigator.clipboard.writeText(t); e.target.textContent = '已复制'; } catch { e.target.textContent = '复制失败，请手动选择'; }
      setTimeout(() => (e.target.textContent = '复制邮箱'), 2000);
    });
    // 导航高亮当前分区
    const links = $$('[data-spy]');
    const spy = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) links.forEach((a) => a.classList.toggle('on', a.dataset.spy === e.target.id)); }), { rootMargin: '-45% 0px -50% 0px' });
    links.forEach((a) => { const s = document.getElementById(a.dataset.spy); if (s) spy.observe(s); });
  }

  // ---------- AI 分身「小莫」 ----------
  const agent = { open: false, asked: new Set(), suggestions: [], bot: null, greeted: false };
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  function openAgent(q) {
    agent.open = true;
    $('#agent').classList.add('open'); $('#agent').setAttribute('aria-hidden', 'false');
    $('#scrim').classList.add('on'); document.body.classList.add('chatting'); hideBubble();
    if (q) ask(q); else setTimeout(() => $('#q').focus({ preventScroll: true }), 60);
  }
  function closeAgent() {
    agent.open = false;
    $('#agent').classList.remove('open'); $('#agent').setAttribute('aria-hidden', 'true');
    $('#scrim').classList.remove('on'); document.body.classList.remove('chatting');
  }
  function addMsg(role, text) {
    const d = document.createElement('div');
    d.className = 'msg ' + (role === 'user' ? 'me' : 'bot');
    d.textContent = text;
    $('#msgs').append(d); $('#msgs').scrollTop = 1e9;
    return d;
  }
  function renderSugg(chips = []) {
    const list = [...new Set([...chips, ...agent.suggestions])].filter((x) => !agent.asked.has(x)).slice(0, 3);
    $('#sugg').innerHTML = '';
    for (const s of list) { const b = document.createElement('button'); b.type = 'button'; b.textContent = s; b.onclick = () => ask(s); $('#sugg').append(b); }
  }
  // 逐段显示回答，像在打字；减少动效时直接显示
  async function typeOut(el, text) {
    if (reduce) { el.textContent = text; return; }
    const parts = text.match(/[^，。；：\n]+[，。；：\n]?|\n/g) || [text];
    el.textContent = '';
    for (const p of parts) { el.textContent += p; $('#msgs').scrollTop = 1e9; await sleep(Math.min(70, 12 + p.length * 2)); }
  }
  async function ask(q) {
    q = String(q || '').trim();
    if (!q || ask.busy || !agent.bot) return;
    ask.busy = true; agent.asked.add(q);
    $('#sugg').innerHTML = ''; $('#askForm button').disabled = true;
    addMsg('user', q);
    const t = addMsg('bot', ''); t.classList.add('typing'); t.setAttribute('aria-label', '小莫正在输入');
    $('#buddyMini')?.classList.add('think');
    try {
      const r = agent.bot.ask(q);
      await sleep(reduce ? 0 : 420 + Math.min(q.length * 12, 380));
      t.classList.remove('typing'); t.removeAttribute('aria-label');
      await typeOut(t, r.text);
      renderSugg(r.chips || []);
    } catch (e) {
      t.classList.remove('typing'); t.textContent = '这个问题我没处理好，换个问法试试，或者直接发邮件问他。';
      renderSugg();
    } finally { ask.busy = false; $('#askForm button').disabled = false; $('#buddyMini')?.classList.remove('think'); if (matchMedia('(pointer: fine)').matches) $('#q').focus({ preventScroll: true }); }
  }
  // 小玩偶：眼睛跟着鼠标，偶尔眨眼，首次出现时打个招呼
  const bubble = () => $('#buddyBubble');
  function hideBubble() { bubble()?.classList.remove('on'); }
  function wireBuddy() {
    const b = $('#buddy'); if (!b) return;
    const eyes = $$('#buddy-sym .eye');
    addEventListener('pointermove', (e) => {
      if (reduce || agent.open) return;
      const r = b.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const dx = Math.max(-1, Math.min(1, (e.clientX - cx) / 300)), dy = Math.max(-1, Math.min(1, (e.clientY - cy) / 300));
      eyes.forEach((el) => el.setAttribute('transform', `translate(${(dx * 2.2).toFixed(2)} ${(dy * 2).toFixed(2)})`));
    }, { passive: true });
    let seen = false; try { seen = sessionStorage.getItem('buddy-hi') === '1'; } catch {}
    if (!seen) setTimeout(() => { if (!agent.open) { bubble()?.classList.add('on'); try { sessionStorage.setItem('buddy-hi', '1'); } catch {} setTimeout(hideBubble, 7000); } }, 2200);
    $('#buddyBubbleX')?.addEventListener('click', (e) => { e.stopPropagation(); hideBubble(); });
  }

  document.addEventListener('click', (e) => {
    const a = e.target.closest('[data-ask]');
    if (a) { e.preventDefault(); openAgent(a.dataset.ask); return; }
    if (e.target.closest('[data-open-agent]')) openAgent();
  });
  $('#closeAgent').onclick = closeAgent;
  $('#scrim').onclick = closeAgent;
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && agent.open) closeAgent(); });
  $('#askForm').onsubmit = (e) => { e.preventDefault(); const q = $('#q').value; if (!q.trim() || ask.busy) return; $('#q').value = ''; ask(q); };

  (async () => {
    const p = DATA;
    window.__pub = p;
    document.title = `${p.name}${p.headline ? ' · ' + p.headline : ' · 个人主页'}`;
    const st = render(p);
    board(st);
    wire(st);
    agent.bot = createAgent(p);
    addMsg('bot', p.welcome || `你好，我是${p.name}的 AI 分身。可以问我${p.name}的项目、经历、做事方法，或者求职意向。`);
    agent.suggestions = p.questions?.length ? p.questions : ['做过哪些项目？', '有什么实习经历？', '擅长什么？', '在哪里读书？', '求职意向是什么？', '怎么联系？'];
    renderSugg();
    wireBuddy();
    if (/^#detail-/.test(location.hash)) route(); else if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
  })();
})();

</script>
</body>
