<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>莫晋睿 · 个人主页</title>
<meta name="description" content="莫晋睿的个人主页：产品方法、项目、实习经历和 AI 分身">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Caveat:wght@500;700&display=swap">
<style>
/* 个人主页：白板 / 亲和图的视觉语言。马克笔蓝写字，荧光笔只划真实数字 */
:root {
  --board: #eef1f4;
  --paper: #ffffff;
  --ink: #15213b;
  --graphite: #5a6577;
  --rule: #ccd3dc;
  --marker: #2448c9;
  --marker-soft: #dfe6fb;
  --hl: #ffe45c;
  --note: #fff7c2;
  --note-ink: #4a3d00;
  --latin: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
  --cn: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  --font: var(--latin), var(--cn);
  color-scheme: light only;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0; background: var(--board); color: var(--ink);
  font: 16px/1.7 var(--font); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  /* 白板上淡淡的点阵 */
  background-image: radial-gradient(color-mix(in srgb, var(--rule) 70%, transparent) 1px, transparent 1px);
  background-size: 22px 22px;
}
a { color: var(--marker); text-underline-offset: 3px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--marker); outline-offset: 3px; border-radius: 4px; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }
@media (max-width: 640px) { .wrap { padding: 0 16px; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* 荧光笔：只用在数字上 */
mark.hl {
  color: inherit; padding: 0 .12em; border-radius: 2px;
  background: linear-gradient(transparent 52%, var(--hl) 52%, var(--hl) 92%, transparent 92%) no-repeat 0 0 / 100% 100%;
  transition: background-size .5s ease;
}
.ink-in mark.hl { background-size: 0% 100%; }
.ink-in.inked mark.hl { background-size: 100% 100%; }

/* ---------- 顶栏 ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  background: color-mix(in srgb, var(--board) 88%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--rule);
}
.top .wrap { display: flex; align-items: center; gap: 20px; height: 60px; }
.top .me { font-weight: 700; color: var(--ink); text-decoration: none; font-size: 17px; letter-spacing: .02em; margin-right: auto; white-space: nowrap; }
.top nav { display: flex; gap: 4px; }
.top nav a { color: var(--graphite); text-decoration: none; font-size: 15px; padding: 6px 10px; border-radius: 6px; }
.top nav a:hover { color: var(--ink); }
.top nav a.on { color: var(--ink); box-shadow: inset 0 -2px 0 var(--marker); border-radius: 0; }
.ask-btn {
  display: inline-flex; align-items: center; gap: 8px; border: 0; cursor: pointer;
  background: var(--ink); color: var(--board); padding: 8px 14px 8px 12px; border-radius: 999px; font-size: 14px; font-weight: 600; white-space: nowrap;
}
.ask-btn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--hl); box-shadow: 0 0 0 3px color-mix(in srgb, var(--hl) 35%, transparent); }
@media (max-width: 760px) { .top nav { display: none; } }

/* ---------- 首屏 ---------- */
.hero { padding: 64px 0 40px; }
.hero .wrap { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 48px; align-items: start; }
.hero .role { color: var(--graphite); margin: 0 0 18px; font-size: 15px; }
.hero h1 {
  font-size: clamp(56px, 9vw, 104px); line-height: .95; margin: 0 0 22px; letter-spacing: .02em; font-weight: 800;
}
.hero h1 .en { display: block; font-family: var(--latin); font-stretch: 125%; font-weight: 300; font-size: .26em; letter-spacing: .04em; color: var(--graphite); margin-top: 14px; }
.hero .headline span { display: inline-block; }
.hero .headline { font-size: clamp(21px, 2.4vw, 26px); line-height: 1.45; font-weight: 600; margin: 0 0 14px; max-width: 18em; text-wrap: balance; }
.hero .bio { color: var(--graphite); margin: 0 0 26px; max-width: 32em; }
.cta { display: flex; flex-wrap: wrap; gap: 10px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 10px; cursor: pointer;
  border: 1.5px solid var(--ink); background: transparent; color: var(--ink); text-decoration: none; font-weight: 600; font-size: 15px;
}
.btn.solid { background: var(--marker); border-color: var(--marker); color: #fff; }
.btn:hover { background: var(--marker-soft); }
.btn.solid:hover { background: var(--marker); filter: brightness(1.08); }
.hero .wrap.solo { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 900px) { .hero .wrap { grid-template-columns: 1fr; gap: 32px; } .hero { padding-top: 36px; } }

/* 白板：可拖动的便利贴，点「整理」按方法归类 */
.board {
  position: relative; background: var(--paper); border: 1px solid var(--rule); border-radius: 14px;
  height: 460px; overflow: hidden; touch-action: pan-y;
}
.board-bar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; align-items: center; gap: 8px; padding: 10px 12px;
  border-top: 1px solid var(--rule); background: color-mix(in srgb, var(--paper) 92%, transparent); }
.board-bar .hint { font-size: 13px; color: var(--graphite); margin-right: auto; line-height: 1.4; }
.chipbtn { border: 1px solid var(--rule); background: var(--paper); padding: 5px 12px; border-radius: 999px; cursor: pointer; font-size: 13px; white-space: nowrap; }
.chipbtn:hover { border-color: var(--ink); }
.chipbtn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.cols { position: absolute; inset: 0 0 52px; display: grid; grid-template-columns: repeat(4, 1fr); pointer-events: none; opacity: 0; transition: opacity .4s; }
.sorted .cols { opacity: 1; }
.cols div { position: relative; border-right: 1px dashed var(--rule); padding: 12px 10px 0; font-size: 14px; }
.cols b { display: block; }
.cols div:last-child { border-right: 0; }
.cols small { display: block; font-weight: 400; color: var(--graphite); font-size: 12px; }
.note {
  position: absolute; left: 0; top: 0; z-index: 2; cursor: grab; user-select: none; -webkit-user-select: none;
  background: var(--note); color: var(--note-ink); border: 0; padding: 6px 10px; font-size: 14px; line-height: 1.3; border-radius: 3px;
  box-shadow: 0 1px 0 color-mix(in srgb, var(--note-ink) 18%, transparent), 0 6px 14px -8px color-mix(in srgb, var(--ink) 40%, transparent);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px;
  transition: transform .75s cubic-bezier(.2, .8, .2, 1), width .5s, background .2s;
}
.note.s1 { background: #d9f0ff; color: #0c3a5c; }
.note.s2 { background: #ffe0d6; color: #5c1d0c; }
.note.s3 { background: #e3f6d8; color: #23440f; }

.board.sorted .note { white-space: normal; text-align: left; }
.note.dragging { transition: none; cursor: grabbing; z-index: 4; }
.note.lit { outline: 2px solid var(--marker); }
.board.drift .note:not(.dragging) { animation: bob 6s ease-in-out infinite; animation-delay: var(--d, 0s); }
.board.sorted .note, .board.sorted.drift .note:not(.dragging) { animation: none; }
@keyframes bob { 50% { translate: 0 -5px; } }
@media (prefers-reduced-motion: reduce) { .note { transition: none; } .board.drift .note { animation: none; } mark.hl { transition: none; } }
.pop {
  position: absolute; z-index: 6; width: min(320px, calc(100% - 24px)); background: var(--paper); color: var(--ink);
  border: 1px solid var(--ink); border-radius: 10px; padding: 12px 14px; font-size: 14px; line-height: 1.6;
  box-shadow: 0 12px 30px -12px color-mix(in srgb, var(--ink) 50%, transparent);
}
.pop b { display: block; margin-bottom: 4px; }
.pop p { margin: 0 0 8px; }
.pop .src { color: var(--graphite); font-size: 12px; }
.pop .row { display: flex; gap: 8px; justify-content: space-between; align-items: center; margin-top: 4px; }
@media (max-width: 640px) { .board { height: 420px; } .note { font-size: 13px; padding: 5px 8px; } .cols div { font-size: 13px; padding: 8px 6px 0; } .cols small { display: none; } }

/* 关键数字 */
.stats { padding: 8px 0 24px; }
.stats ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0; border-top: 1.5px solid var(--ink); }
.stats li { padding: 18px 20px 6px 0; }
.stats .n { font-family: var(--latin), var(--cn); font-stretch: 125%; font-weight: 800; font-size: clamp(34px, 4vw, 46px); line-height: 1.1; display: inline-block; }
.stats .l { display: block; color: var(--graphite); font-size: 14px; margin-top: 6px; max-width: 18em; }

/* ---------- 分区通用 ---------- */
.sec { padding: 72px 0 24px; }
.sec-h { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 7fr); gap: 32px; align-items: end; margin-bottom: 32px; }
.sec-h h2 { font-size: clamp(30px, 4vw, 42px); line-height: 1.15; margin: 0; letter-spacing: .01em; }
.sec-h p { margin: 0; color: var(--graphite); max-width: 36em; }
@media (max-width: 800px) { .sec-h { grid-template-columns: 1fr; gap: 10px; } .sec { padding-top: 56px; } }

/* 方法：真实的先后顺序，所以编号 */
.method { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1.5px solid var(--ink); }
.step { padding: 20px 18px 22px 0; border-right: 1px solid var(--rule); }
.step + .step { padding-left: 18px; }
.step:last-child { border-right: 0; }
.step .no { font-family: var(--latin); font-stretch: 125%; font-weight: 300; font-size: 40px; line-height: 1; color: var(--marker); }
.step h3 { font-size: 20px; margin: 10px 0 4px; }
.step .def { color: var(--graphite); font-size: 14px; margin: 0 0 14px; }
.step ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.step li { font-size: 14px; line-height: 1.65; }
.step li .src { display: block; color: var(--graphite); font-size: 12px; margin-top: 2px; }
.step li.lit { background: var(--marker-soft); margin: -6px -8px; padding: 6px 8px; border-radius: 6px; }
.kws { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.kw { border: 1px solid var(--rule); background: var(--paper); border-radius: 999px; padding: 2px 10px; font-size: 12px; cursor: pointer; }
.kw[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
@media (max-width: 900px) { .method { grid-template-columns: 1fr 1fr; } .step:nth-child(2) { border-right: 0; } .step:nth-child(3) { padding-left: 0; } .step:nth-child(n+3) { border-top: 1px solid var(--rule); } }
@media (max-width: 560px) { .method { grid-template-columns: 1fr; } .step, .step + .step { padding-left: 0; border-right: 0; } .step + .step { border-top: 1px solid var(--rule); } }

/* 项目：一个项目一整行，媒体与文字左右交替 */
.case { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: 40px; padding: 36px 0; border-top: 1.5px solid var(--ink); align-items: start; }
.case:nth-child(even) .media { order: 2; }
.media { position: relative; border-radius: 12px; overflow: hidden; background: var(--ink); aspect-ratio: 640 / 432; }
.media video, .media img { display: block; width: 100%; height: 100%; object-fit: cover; }
.media .play {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 10px; border: 0; cursor: pointer;
  background: linear-gradient(transparent 55%, rgba(10, 16, 30, .65)); color: #fff; font-size: 15px; font-weight: 600;
}
.media .play span { display: inline-flex; align-items: center; gap: 10px; background: rgba(255, 255, 255, .94); color: #15213b; padding: 10px 18px; border-radius: 999px; }
.media .play svg { width: 14px; height: 14px; }
/* 没有图片 / 视频的项目：用项目自己的关键词拼一块白板 */
.typo { background: var(--paper); border: 1px solid var(--rule); color: var(--ink); display: flex; flex-direction: column; justify-content: space-between; padding: 22px; }
.typo .res { margin-top: 28px; }
.typo .big { display: block; font-family: var(--latin), var(--cn); font-stretch: 125%; font-weight: 800; font-size: clamp(56px, 7vw, 92px); line-height: 1; }
.typo .ctx { display: block; margin-top: 14px; color: var(--graphite); font-size: 15px; max-width: 22em; }
.typo .t { font-size: clamp(26px, 3.2vw, 38px); font-weight: 800; line-height: 1.15; max-width: 10em; }
.typo .tags { display: flex; flex-wrap: wrap; gap: 8px; }
.typo .tags span { background: var(--note); color: var(--note-ink); padding: 5px 10px; font-size: 13px; border-radius: 3px; rotate: var(--r, 0deg); }
.typo .open { position: absolute; right: 16px; top: 16px; font-size: 13px; }
.case .when { color: var(--graphite); font-size: 14px; margin: 0 0 6px; font-variant-numeric: tabular-nums; }
.case h3 { font-size: clamp(24px, 2.6vw, 30px); line-height: 1.25; margin: 0 0 12px; }
.case .lede { margin: 0 0 14px; }
.case .more { margin: 0 0 14px; padding: 0; list-style: none; display: grid; gap: 10px; }
.case .more li { font-size: 15px; color: var(--ink); }
.case .more li b { display: block; font-size: 13px; color: var(--graphite); font-weight: 600; }
.tagline { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0 0 18px; padding: 0; list-style: none; color: var(--graphite); font-size: 13px; }
.tagline li::before { content: '#'; color: var(--marker); margin-right: 2px; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; }
.acts .btn { padding: 8px 14px; font-size: 14px; }
@media (max-width: 860px) { .case { grid-template-columns: 1fr; gap: 20px; } .case:nth-child(even) .media { order: 0; } }

/* 经历：时间线 */
.tl { list-style: none; margin: 0; padding: 0; border-top: 1.5px solid var(--ink); }
.tl > li { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 28px; padding: 26px 0; border-bottom: 1px solid var(--rule); }
.tl .when { color: var(--graphite); font-size: 14px; font-variant-numeric: tabular-nums; padding-top: 4px; }
.tl h3 { font-size: 22px; margin: 0; }
.tl .title { color: var(--graphite); margin: 2px 0 10px; }
.tl .lede { margin: 0 0 10px; max-width: 46em; }
.tl .more { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 12px; max-width: 46em; }
.tl .more b { display: block; font-size: 13px; color: var(--graphite); }
.linkish { border: 0; background: none; color: var(--marker); cursor: pointer; padding: 0; font-weight: 600; font-size: 14px; }
@media (max-width: 640px) { .tl > li { grid-template-columns: 1fr; gap: 4px; } }

/* 教育背景：两所学校并排 */
.edu { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1.5px solid var(--ink); }
.edu .it { padding: 22px 28px 8px 0; display: flex; gap: 18px; align-items: flex-start; }
.edu .info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.edu .crest { flex: none; width: 80px; height: 80px; box-sizing: border-box; padding: 8px; display: flex; align-items: center; justify-content: center; background: #fff; border: 1px solid var(--rule); border-radius: 16px; overflow: hidden; }
.edu .crest img { display: block; width: 100%; height: 100%; object-fit: contain; }
.edu .crest .mono { font-family: var(--latin), var(--cn); font-stretch: 112%; font-weight: 800; font-size: 15px; color: var(--marker); letter-spacing: .02em; }
.edu .badge { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; padding: 2px 10px 2px 8px; border-radius: 999px; background: var(--hl); color: var(--ink); }
.edu .badge::before { content: '★'; font-size: 11px; }
.edu .it + .it { padding-left: 28px; border-left: 1px solid var(--rule); }
.edu .when { color: var(--graphite); font-size: 14px; font-variant-numeric: tabular-nums; }
.edu b { font-size: clamp(20px, 2.2vw, 24px); line-height: 1.35; }
.edu .deg { font-weight: 600; }
.edu p { margin: 6px 0 0; color: var(--graphite); font-size: 14px; max-width: 34em; }
@media (max-width: 760px) { .edu { grid-template-columns: 1fr; } .edu .it + .it { padding-left: 0; border-left: 0; border-top: 1px solid var(--rule); } }

/* 校园与技能 */
.bg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; border-top: 1.5px solid var(--ink); padding-top: 24px; }
.bg h3 { font-size: 15px; color: var(--graphite); margin: 0 0 12px; font-weight: 600; }
.bg .it { margin-bottom: 18px; }
.bg .it b { display: block; font-size: 17px; line-height: 1.4; }
.bg .it span { display: block; color: var(--graphite); font-size: 14px; }
.bg .it p { margin: 4px 0 0; font-size: 14px; }
.skills { display: flex; flex-wrap: wrap; gap: 6px; }
.skills span { border: 1px solid var(--rule); background: var(--paper); border-radius: 6px; padding: 3px 10px; font-size: 14px; }
@media (max-width: 860px) { .bg { grid-template-columns: 1fr; gap: 8px; } }
.about { margin-top: 40px; font-size: clamp(18px, 2vw, 21px); line-height: 1.75; max-width: 38em; }

/* 联系 */
.contact { padding: 88px 0 120px; }
.contact h2 { font-size: clamp(32px, 5vw, 56px); line-height: 1.15; margin: 0 0 18px; max-width: 14em; }
.contact .mail { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; font-family: var(--latin), var(--cn); font-size: clamp(20px, 2.6vw, 28px); font-weight: 600; margin-bottom: 22px; word-break: break-all; }
.contact .mail a { color: var(--ink); text-decoration-thickness: 2px; text-decoration-color: var(--hl); }
footer { border-top: 1px solid var(--rule); padding: 20px 0 40px; color: var(--graphite); font-size: 13px; }
footer .wrap { display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: space-between; }

/* ---------- AI 分身面板 ---------- */
.agent {
  position: fixed; z-index: 50; top: 0; right: 0; bottom: 0; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); width: min(420px, 100vw);
  background: var(--paper); border-left: 1px solid var(--rule); display: flex; flex-direction: column;
  box-shadow: -20px 0 50px -30px color-mix(in srgb, var(--ink) 60%, transparent);
  transform: translateX(100%); visibility: hidden; transition: transform .35s cubic-bezier(.2, .8, .2, 1), visibility 0s .35s;
}
.agent.open { transform: none; visibility: visible; transition: transform .35s cubic-bezier(.2, .8, .2, 1); }
@media (prefers-reduced-motion: reduce) { .agent, .agent.open { transition: none; } }
.agent header { display: flex; align-items: flex-start; gap: 12px; padding: 18px 18px 14px; border-bottom: 1px solid var(--rule); }
.agent header div { margin-right: auto; }
.agent header b { display: block; font-size: 17px; }
.agent header small { color: var(--graphite); font-size: 13px; }
.x { border: 1px solid var(--rule); background: none; border-radius: 8px; width: 34px; height: 34px; cursor: pointer; font-size: 18px; line-height: 1; flex: none; }
.msgs { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; overscroll-behavior: contain; }
.msg { max-width: 88%; padding: 10px 14px; border-radius: 14px; font-size: 15px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
.msg.bot { background: var(--board); align-self: flex-start; border-bottom-left-radius: 4px; }
.msg.me { background: var(--ink); color: var(--paper); align-self: flex-end; border-bottom-right-radius: 4px; }
.msg.typing { color: var(--graphite); }
.msg.typing::after { content: ''; display: inline-block; width: 1.2em; text-align: left; animation: dots 1.2s steps(4) infinite; }
@keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
.sugg { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 18px 12px; }
.sugg button { border: 1px solid var(--rule); background: var(--paper); border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; text-align: left; }
.sugg button:hover { border-color: var(--marker); color: var(--marker); }
.agent form { display: flex; gap: 8px; padding: 12px 14px 14px; border-top: 1px solid var(--rule); }
.agent input { flex: 1; min-width: 0; border: 1.5px solid var(--rule); border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 15px; background: var(--board); color: var(--ink); }
.agent input:focus { outline: none; border-color: var(--marker); }
.agent form button { border: 0; background: var(--marker); color: #fff; border-radius: 10px; padding: 0 16px; font-weight: 600; cursor: pointer; }
.agent form button:disabled { opacity: .5; cursor: default; }

// 个人主页：渲染 /api/public/:slug，白板交互 + AI 分身

  const slug = decodeURIComponent(location.pathname.split('/').filter(Boolean)[1] || '');

不是商品。一个角色的新周边可能在任何店铺、任何时间上架，而现有电商的提醒都要求先收藏某个商品，追不到还没上架的新品。会员购聚合了多个 IP，又有用户的追番、点赞、收藏数据，具备按角色组织商品的条件。"}, {"t": "h", "text": "2　用户调研：202 份问卷验证 4 个假设"}, {"t": "stats", "items": [{"n": "202", "l": "份有效问卷（19 题）"}, {"n": "71.3%", "l": "周边购买者围绕本命购买"}, {"n": "49.1%", "l": "有 2 个及以上本命"}, {"n": "2.3×", "l": "本命推送接受度是通用促销的倍数"}]}, {"t": "bars", "title": "遇到过的问题（多选）", "items": [{"label": "本命出了新周边没及时发现", "v": 39.8, "hl": true}, {"label": "预售忘记补尾款", "v": 26.9}]}, {"t": "bars", "title": "推送接受度：只推本命 vs 通用促销", "items": [{"label": "本命相关推送", "v": 77.7, "hl": true}, {"label": "通用促销推送", "v": 33.2}], "note": "据此定下推送策略：只推本命，不推促销。"}, {"t": "bars", "title": "最想要的功能", "items": [{"label": "本命新周边上架提醒", "v": 52.0, "hl": true}, {"label": "预售补款提醒", "v": 27.2}], "note": "另有 61.9% 的用户愿意通过番剧页入口查看角色周边，16.3% 认为会打扰观看，所以入口只放在简介区，不在播放画面上弹出。"}, {"t": "h", "text": "3　竞品分析：提醒都以「单个商品」为单位"}, {"t": "table", "head": ["", "淘宝 / 京东", "闲鱼", "IP 官方渠道", "会员购现状"], "rows": [["提醒的单位", "单个商品，需先收藏", "无新品追踪", "按角色推系列", "无按角色追踪"], ["能否追踪未上架新品", "否", "否", "仅自家 IP", "否"], ["覆盖的 IP", "多", "多（二手）", "单一 IP，分散在多个店铺", "多"], ["番剧内容联动", "无", "无", "无", "有内容和追番数据，未打通"]]}, {"t": "callout", "text": "切入点：按角色主动追踪（竞品空白）＋ 番剧内容联动（B 站独有）。"}, {"t": "h", "text": "4　优先级决策：RICE ＋ 价值 / 成本四象限"}, {"t": "quadrant", "x": ["开发成本低", "开发成本高"], "y": ["价值低", "价值高"], "q": ["先做", "值得投入", "可以缓做", "不做 / 再调研"], "items": [{"label": "新周边提醒", "x": 0.28, "y": 0.86, "tag": "P0"}, {"label": "预售补款日历", "x": 0.16, "y": 0.7, "tag": "P0"}, {"label": "本命设定", "x": 0.38, "y": 0.78, "tag": "P0"}, {"label": "番剧页角色入口", "x": 0.62, "y": 0.74, "tag": "P0 灰度"}, {"label": "收集图鉴", "x": 0.42, "y": 0.4, "tag": "P1"}, {"label": "吃谷账本", "x": 0.24, "y": 0.32, "tag": "P1"}, {"label": "AI 问答", "x": 0.86, "y": 0.3, "tag": "P2"}], "note": "价值取自问卷中的需求率和痛点率；AI 问答需求一般、开发成本最高，放到 P2，补充调研后再定。"}, {"t": "h", "text": "5　核心功能与高保真原型"}, {"t": "gallery", "items": [{"src": "media/bili-ui-1.jpg", "caption": "首页「我的本命」卡片 · 设置我的本命"}, {"src": "media/bili-ui-2.jpg", "caption": "新品动态 · 提醒设置"}, {"src": "media/bili-ui-3.jpg", "caption": "补款日历 · 三类推送样式"}, {"src": "media/bili-ui-4.jpg", "caption": "番剧页角色周边入口 · 浮层"}]}, {"t": "h", "text": "6　业务流程"}, {"t": "image", "src": "media/bili-flow.jpg", "caption": "浅蓝为用户主流程起止，浅黄为系统触发的提醒，虚线为提醒或其他入口触发的跳转。", "narrow": true}, {"t": "h", "text": "7　关键规则（PRD 摘录）"}, {"t": "toggle", "title": "推送频控：不让提醒变成打扰", "blocks": [{"t": "list", "items": ["只推本命相关商品，不推通用新品和促销", "每人每天最多 3 条推送，超出只进站内消息；22:00 至次日 8:00 不推送", "同一本命 1 小时内多件上新，合并为一条「你的本命上新了 N 件周边」", "补款提醒属于交易通知，不计入每日上限"]}]}, {"t": "toggle", "title": "本命上限为什么是 10 个", "blocks": [{"t": "p", "text": "调研中 49.1% 的周边购买者有 2 个及以上本命，23.4% 有 4 个及以上。上限 10 个覆盖绝大多数用户，同时控制提醒数量。推荐角色只作候选，必须用户确认才生效。"}]}, {"t": "toggle", "title": "补款日历的提醒节点", "blocks": [{"t": "list", "items": ["尾款开始日、截止前 3 天、前 1 天、当天各提醒一次", "1 天内截止的订单置顶突出", "从任何入口完成支付后，剩余提醒自动取消"]}]}, {"t": "toggle", "title": "番剧页入口的灰度方案", "blocks": [{"t": "p", "text": "先对 10% 的番剧用户灰度 2 周。入口点击率不低于 5%、关闭率不高于 10% 时再全量。用户点「不感兴趣」后，该番剧 30 天内不再展示入口。"}]}, {"t": "h", "text": "8　指标体系"}, {"t": "table", "head": ["目标", "核心指标"], "rows": [["用户愿意设置本命", "本命设置率（上线 3 个月达到会员购活跃用户的 20%）、人均本命数"], ["提醒有用且不打扰", "提醒送达率、点击率、点击后下单转化率、提醒关闭率"], ["不再忘补尾款", "尾款按时支付率、补款日历访问率"], ["番剧流量转化为购买", "入口曝光点击率、「不感兴趣」率、带来的会员购订单数"]]}]}, {"id": "health", "name": "大学生心理健康平台", "role": "项目负责人", "startDate": "2026-02", "endDate": "2026-03", "tech": "Say-Do-Make、卡片分类法、用户访谈、Figma、信息架构", "link": "https://www.figma.com/proto/2wMoA61Hhs1vHrdXHXT4V0/Psychologicalinterface?node-id=0-1&t=3bThIUIiQzFj27kZ-1", "linkLabel": "打开 Figma 原型", "summary": "Ethereal Pavilion：面向高压大学生的心理健康 App 原型，把「记录 → 识别压力 → 即时减压 → 回看成长」串成一个闭环。", "description": "项目背景：面向大学生高压场景的集成式心理健康管理平台，负责用户调研、功能规划与原型交付全流程。\n用户调研与痛点挖掘：基于 Say-Do-Make 调研框架，通过卡片分类法开展用户访谈与行为路径分析，挖掘出大学生在高压环境下心理与生理管理脱节的核心痛点，针对性降低与用户流失相关的认知负荷。\n功能规划与原型设计：负责功能规划与核心业务流程设计，使用 Figma 输出高保真原型，落地「情绪快速打卡 + 压力热力图 + 正念引导」集成式心理仪表盘；采用极简卡片式布局优化信息架构，提升数据可视化直观度，经两轮可用性测试迭代交互路径，用户交互满意度提升 30%。", "page": [{"t": "props", "items": [["产品", "Ethereal Pavilion（英文界面高保真原型）"], ["角色", "项目负责人"], ["时间", "2026.02 – 2026.03"], ["方法", "Say-Do-Make · 卡片分类法 · 用户访谈 · 可用性测试"], ["产出", "调研结论、功能规划、Figma 高保真原型"]]}, {"t": "callout", "text": "大学生不缺心理健康 App，缺的是一个能把「我今天感觉怎样」和「接下来我能做什么」连在一起的地方。"}, {"t": "h", "text": "1　用户研究"}, {"t": "p", "text": "用 **Say-Do-Make** 框架组织调研：访谈听用户怎么说，行为路径分析看用户怎么做，卡片分类让用户自己排出功能的组织方式。三者对照后发现，高压环境下的大学生**心理和生理管理是脱节的**：情绪、压力和放松练习分散在不同工具里，看不出关联；记录负担又让用户很快流失。"}, {"t": "h", "text": "2　设计思路：一个闭环，而不是一堆功能"}, {"t": "loop", "steps": ["记录与自评", "识别压力", "即时减压", "回看成长"], "note": "每一步都直接把用户送到下一步：首页发现压力偏高，就提示去做呼吸练习；练习的次数和时长又回到成长页，变成看得见的进度。"}, {"t": "h", "text": "3　信息架构"}, {"t": "table", "head": ["模块", "页面", "用户在这里要完成的事"], "rows": [["首页", "记录与自评", "花几秒记下今天的心情，看到本周情绪和当前焦虑水平"], ["减压支持", "呼吸引导（Breathing）", "压力高时，跟着动画做一组呼吸，马上平静下来"], ["减压支持", "肯定语与感恩日记（Affirmations）", "读一句和今天情绪匹配的肯定语，写下或说出一件值得感恩的事"], ["成长", "Your Journey", "看压力趋势、连续天数和本周目标，确认自己在变好"]]}, {"t": "p", "text": "减压支持只用两个标签切换，不再往下分层：压力大的时候，用户没有耐心找入口。"}, {"t": "h", "text": "4　页面拆解"}, {"t": "screens", "items": [{"tag": "首页", "title": "记录与自评", "imgs": [{"src": "media/health-home.jpg", "alt": "首页：记录与自评"}], "points": ["顶部主卡直接问「今天压力大吗？」，打开 App 第一件事就是记录", "高压预警卡：近期指标偏高时主动提醒，并给出下一步「试试呼吸练习」", "两个主按钮分开两条路：「快速自评」负责记录，「获取减压支持」负责求助", "Weekly Mood 用表情记录一周情绪，当天显示「+」补记，空着的日子一眼就能看到", "Current Vitals 用进度条加「High」标签展示焦虑水平，不让用户读分数"]}, {"tag": "减压支持", "title": "呼吸引导", "imgs": [{"src": "media/health-breathing.jpg", "alt": "减压支持：呼吸引导"}], "points": ["顶部 Breathing / Affirmations 两个标签，切换两种减压方式", "分析结果卡先给结论「High Stress」，再说明依据（心率变异性和近期输入），并可以重新测试", "呼吸练习用缩放的圆环动画引导吸气和屏息，「Hold for 4 seconds」把动作说具体", "下方 Daily Sanctuaries 提供每日放松内容，练完还有可以继续的地方"]}, {"tag": "减压支持", "title": "肯定语与感恩日记", "imgs": [{"src": "media/health-affirm-1.jpg", "alt": "肯定语页上半部分"}, {"src": "media/health-affirm-2.jpg", "alt": "肯定语页下半部分"}], "points": ["今日肯定语卡片，可以「Share Light」分享或「Save to Pavilion」收藏", "「Based on your mood today」按当天情绪推荐内容，标注「Recommended for: Calm」，并可查看更多同类", "感恩日记同时支持文字和语音输入，降低记录负担", "Affirmation Gallery 按主题（如 Strength）整理成图片卡片，作为每日练习的视觉提示"]}, {"tag": "成长", "title": "Your Journey", "imgs": [{"src": "media/health-journey.jpg", "alt": "成长页"}], "points": ["顶部展示连续打卡 12 天、正念 240 分钟，给坚持一个看得见的回报", "Stress Trends 支持 7 天 / 30 天切换，高亮今天，压力的高峰和规律一目了然", "Weekly Focus 用 75% 圆环提示「还差 3 次达成本周正念目标」，目标拆小，更容易完成", "下方 Soul Badges 成就徽章，强化长期使用"]}]}, {"t": "figma", "url": "https://www.figma.com/proto/2wMoA61Hhs1vHrdXHXT4V0/Psychologicalinterface?node-id=0-1&t=3bThIUIiQzFj27kZ-1"}, {"t": "h", "text": "5　验证"}, {"t": "stats", "items": [{"n": "2 轮", "l": "可用性测试迭代交互路径"}, {"n": "+30%", "l": "用户交互满意度"}]}, {"t": "h", "text": "6　如果继续做：商业延展"}, {"t": "table", "head": ["方向", "思路"], "rows": [["客户", "高校心理健康中心、学工部门：采购给全校学生使用（B2B2C）"], ["价值", "匿名聚合的压力趋势帮学校在考试周等高峰前提前安排资源；个人数据不出个人账户"], ["收费", "按学生规模年费订阅；危机预警转介等增值模块单独计费"], ["底线", "隐私和伦理优先：学校只看匿名统计，高风险信号走专业转介流程"]]}], "cover": "media/health-cover.jpg"}, {"id": "eco", "name": "生态脉搏 EcoPulse", "role": "项目负责人", "startDate": "2026-05", "endDate": "2026-06", "tech": "Research-through-Design、DEFRA 2023 排放因子、情绪化反馈设计、游戏化机制、可用性测试、有声思考法", "link": "https://ecopulse-two.vercel.app/", "linkLabel": "在线体验", "summary": "EcoPulse：面向爱丁堡中国留学生的碳足迹反馈网页。每个日常选择都换算成真实的 kg CO₂e，再用城市健康度、生活类比和生存游戏，让这个数字变得「有感觉」。", "description": "项目背景：传统碳计算器只给一个冰冷的数字，用户算完就走；以 Research-through-Design 方式，为在爱丁堡的中国留学生设计碳足迹反馈原型，探索情绪化隐喻和透明的计算逻辑能否提升理解、信任与持续参与。\n核心功能设计：规划总览、城市地图、碳评分、未来视图、数据来源、生存游戏 6 个模块；城市地图把出行、取暖、购物、回国航班做成 4 个真实情景，每个选择即时换算成 kg CO₂e 和手机充电次数等生活类比，城市健康度随累计碳排下降，让后果看得见。\n游戏机制设计：生存游戏用「碳排 + 精力 + 预算」三资源、8 回合结构，让低碳不再是唯一正确答案；低碳选择积累生态点数，可在科技树解锁保温改造、电单车订阅等永久升级，结算按三项资源评级并进入排行榜。\n数据透明：以 DEFRA 2023 和 Poore & Nemecek (2018) 为数据源，每个结果都可展开查看计算过程与出处，单独设立数据来源与方法页并标注局限性。\n验证与迭代：组织 20+ 名目标用户开展可用性测试与有声思考法调研，根据反馈调优资源消耗比例与交互路径。", "page": [{"t": "props", "items": [["产品", "EcoPulse — Household Carbon Feedback"], ["性质", "Research-through-Design 原型 · 爱丁堡大学"], ["用户", "在爱丁堡生活的中国留学生"], ["数据", "DEFRA 2023 排放因子 · Poore & Nemecek (2018) 食物数据 · 对齐 SDG 12 & 13"], ["角色", "项目负责人（独立完成 0→1）"], ["时间", "2026.05 – 2026.06"], ["方法", "Research-through-Design · 可用性测试 · 有声思考法"]]}, {"t": "callout", "text": "碳排放是看不见的数字。EcoPulse 想回答一个问题：**情绪化的隐喻**和**透明的计算逻辑**，能不能让人真正理解自己的碳足迹、相信它，并且愿意持续用下去？"}, {"t": "h", "text": "1　问题与用户"}, {"t": "p", "text": "在爱丁堡读书的中国留学生，每天都在做出行、取暖、购物、饮食的选择，每年还要飞回国过年，但这些选择的碳排放是看不见的。传统碳计算器让用户填一遍表、拿到一个 kg 数，就结束了：**数字没有感觉，算法看不见，也没有理由再来第二次**。"}, {"t": "h", "text": "2　设计策略：把一个数字变成四种感受"}, {"t": "table", "head": ["要解决的问题", "设计手段", "在产品里的样子"], "rows": [["数字没有感觉", "生活类比", "每个结果都换算成手机充电次数、100W 灯泡小时数、树木吸收天数、牛肉份数、电动车公里数等"], ["后果离自己太远", "城市健康度", "Edinburgh Health 随累计碳排下降，地图从正常变橙、再变红，并配上「Edinburgh is suffering」等提示"], ["不知道数字怎么来的", "计算透明", "每个结果都能展开「Show calculation & source」，另设数据来源与方法页，写明口径和局限"], ["算一次就走", "游戏化", "三资源 8 回合的生存游戏、科技树升级、评级和排行榜，给用户再来一次的理由"]]}, {"t": "h", "text": "3　信息架构"}, {"t": "table", "head": ["模块", "用户在这里做什么"], "rows": [["Overview 总览", "看本次会话的碳排总量、6 类拆分和生活类比，从三张卡片进入主要功能"], ["City Map 城市地图", "在爱丁堡真实地标上点开情景，做选择，马上看到碳排和城市健康度的变化"], ["Carbon Score 碳评分", "看本周碳排按类别拆分、评级，以及「相当于什么」"], ["Data Sources 数据来源", "查每个排放因子的数值、含义和出处，以及方法和局限"], ["Survival Game 生存游戏", "在三种资源之间取舍，玩完 8 回合拿到评级"]]}, {"t": "h", "text": "4　总览与城市地图"}, {"t": "screens", "items": [{"tag": "总览", "title": "Overview", "wide": true, "imgs": [{"src": "media/eco-overview.jpg", "alt": "总览页"}], "points": ["首屏标题「Your household low impact carbon footprint」，一句话说明产品：用 DEFRA 2023 因子把日常行为换算成真实 CO₂e", "Session Carbon 显示本次会话总量，并标出每日平均值作为参照", "Breakdown 按出行、能源、食物、购物、垃圾、航班 6 类拆分", "This Equals 把同一个数字换算成灯泡小时、树木吸收天数、手机充电次数、伦敦—北京航班占比、牛肉份数", "三张入口卡片分别进入城市地图、碳评分和生存游戏；底部写明研究背景和数据来源"]}, {"tag": "城市地图", "title": "情景入口", "wide": true, "imgs": [{"src": "media/eco-map.jpg", "alt": "城市地图首页"}], "points": ["以爱丁堡真实地图为底，地标按 4 类上色：出行、家庭能源、食物与购物、垃圾", "情景放在留学生真正会去的地方：机场、王子街、卡尔顿山、学生宿舍、荷里路德公园", "右上角 Edinburgh Health 显示城市健康度和本次累计碳排，初始 100%", "顶部提示「点击地标探索碳排情景」，不需要说明书就能上手"]}, {"tag": "情景 A", "title": "出行：去卡尔顿山", "wide": true, "imgs": [{"src": "media/eco-a-transport.jpg", "alt": "情景 A：叫 Uber 去卡尔顿山"}], "points": ["情景写实：周六难得晴天，从 Pollock Halls 宿舍到卡尔顿山，2.4 km", "选择「叫 Uber」后，动画展示出租车行驶，结果 0.41 kg CO₂e", "换算成「手机充电 46 次，或 60W 灯泡亮 6.8 小时」", "可展开计算过程和出处（DEFRA 2023 / CEADs），也可以「换个选项试试」", "「62% 的同学做了这个选择，看看他们怎么说」：用同伴数据代替说教"]}, {"tag": "情景 B", "title": "家庭能源：冬天怎么取暖", "wide": true, "imgs": [{"src": "media/eco-b-heating.jpg", "alt": "情景 B：冬季取暖的五个选项"}], "points": ["情景：十一月，室外 4°C、室内 14°C，明天还要交论文", "5 个选项按能耗从高到低排列：暖气开满 22°C（约 5 kWh 燃气）、穿毛衣开 18°C（约 2.5 kWh）、只用电热毯（约 0.1 kWh 电）", "另外两个选项跳出「开多少暖气」：去 24 小时开放的主图书馆、去朋友家共享暖气", "每个选项同时写清能耗和舒适度（最舒服 / 有点冷 / 很冷），取舍摆在明面上"]}, {"tag": "情景 C", "title": "购物：王子街的打折夹克", "wide": true, "imgs": [{"src": "media/eco-c-fashion.jpg", "alt": "买两件快时尚：碳排预警"}, {"src": "media/eco-c-charity.jpg", "alt": "先逛慈善二手店"}], "points": ["同一个情景的两种结果放在一起对比：买 2 件快时尚 17.8 kg，先去 Oxfam 等慈善二手店 0.3 kg", "17.8 kg 换算成「相当于从爱丁堡开车到格拉斯哥」；二手的结果是「比新快时尚少 95% 碳排」", "累计碳排升高后，地图整体变成橙色，弹出 CARBON WARNING 和「城市健康度正在下降」", "低碳的选择配步行动画和绿色反馈，高碳配飘落的快递盒：同一个数字，情绪完全不同"]}, {"tag": "情景 D", "title": "出行：回国过年的航班", "wide": true, "imgs": [{"src": "media/eco-d-flight.jpg", "alt": "情景 D：回国航班"}], "points": ["留学生最大的一笔碳排：学期末回国过年，单程 9,000 km", "订直飞航班的结果是 1,801 kg CO₂e，换算成「约等于 50 周的爱丁堡日常生活碳排」", "地图变成红色，提示「Critical carbon level — Edinburgh is suffering」", "不禁止、不批评，只把代价摆出来，让用户自己判断"]}]}, {"t": "h", "text": "5　碳评分与数据透明"}, {"t": "screens", "items": [{"tag": "碳评分", "title": "Carbon Score", "wide": true, "imgs": [{"src": "media/eco-score.jpg", "alt": "碳评分页"}], "points": ["左侧大字显示本次碳排（0.4 kg，来自城市地图）和评级 Excellent", "右侧 6 类碳排横向条形图，标出每类的 kg 和占比，可以一键重置", "下方「This week equals」用 6 张卡片换算：4 小时灯泡、6.4 天树木吸收、46 次手机充电、0.06% 伦敦—北京航班、0 份牛肉、11 km 电动车"]}, {"tag": "数据来源", "title": "Data sources & methodology", "wide": true, "imgs": [{"src": "media/eco-data.jpg", "alt": "数据来源与方法页"}], "points": ["列出 13 个排放因子：数值、「这意味着什么」、出处，点任意一行可看详情", "每一行都配一个好懂的对照，例如「公交每公里 89 g，比汽油车少 48%」「二手衣服比新衣服少 99%」", "Methodology：遵循 GHG Protocol，航班使用 DEFRA 的辐射强迫系数", "Limitations：食物数据是 119 个国家的全球平均，DEFRA 是英国全国平均，结果仅供参考、不作认证"]}]}, {"t": "h", "text": "6　数值设计：每个结果都能追溯到一行数据"}, {"t": "p", "text": "产品里不出现自造的「分数」或「点数」，所有结果都是用排放因子直接算出的 kg CO₂e，再换算成生活类比："}, {"t": "table", "head": ["情景", "计算", "结果", "生活类比"], "rows": [["叫 Uber 去卡尔顿山", "2.4 km × 0.16983 kg/km（汽油车，DEFRA 2023）", "0.41 kg", "0.41 ÷ 0.00886 kg/次 ≈ 手机充电 46 次"], ["买 2 件快时尚", "2 件 × 8.92 kg/件（DEFRA 2023 材料使用）", "17.8 kg", "≈ 从爱丁堡开车到格拉斯哥"], ["回国直飞航班", "9,000 km × 0.20011 kg/km（长途经济舱 + 辐射强迫）", "1,801 kg", "≈ 50 周的爱丁堡日常生活"]]}, {"t": "toggle", "title": "展开：数据来源页的全部 13 个排放因子", "blocks": [{"t": "table", "head": ["类别", "数值", "含义", "来源"], "rows": [["英国电网电力", "0.207074 kg/kWh", "1 kWh ≈ 23 次手机充电", "DEFRA 2023"], ["天然气", "0.20226 kg/kWh", "1 kWh ≈ 烧 10 次水壶", "DEFRA 2023"], ["汽油车（平均）", "0.16983 kg/km", "爱丁堡→格拉斯哥 73 km = 12.4 kg", "DEFRA 2023"], ["出租车 / 网约车", "0.16983 kg/km", "与单人汽油车相同", "DEFRA 2023"], ["本地公交", "0.089 kg/km", "比汽油车少 48%", "DEFRA 2023"], ["国铁", "0.035 kg/km", "比汽油车少 80%", "DEFRA 2023"], ["长途航班（经济舱 + RF）", "0.20011 kg/km", "爱丁堡→上海 9,000 km = 1,801 kg", "DEFRA 2023"], ["牛肉", "60.0 kg/kg", "200 g 牛肉 = 12.0 kg", "Poore & Nemecek (2018)"], ["禽肉", "6.0 kg/kg", "比同重量牛肉少 10 倍", "Poore & Nemecek (2018)"], ["蔬菜", "0.4 kg/kg", "比同重量牛肉少 150 倍", "Poore & Nemecek (2018)"], ["新衣服", "8.92 kg/件", "≈ 汽油车开 53 km", "DEFRA 2023"], ["二手衣服", "0.06 kg/件", "比新衣服少 99%", "DEFRA 2023"], ["食物垃圾", "填埋 700 kg/吨", "堆肥 8.9 kg/吨，少 79 倍", "DEFRA 2023"]]}]}, {"t": "h", "text": "7　生存游戏：低碳不是唯一的正确答案"}, {"t": "p", "text": "城市地图回答「这个选择排多少碳」，生存游戏回答「在真实生活里，你能不能长期这样选」。玩家要同时管住三种资源，只追求低碳会累垮或花光钱。"}, {"t": "table", "head": ["资源", "含义"], "rows": [["精力 Energy", "太累就撑不下去：步行、自己做饭更低碳，但更耗精力"], ["预算 Budget", "留学生的生活费：外卖、打车省力但花钱"], ["碳排 Carbon", "累计 kg CO₂e，同时影响城市健康度"], ["回合 Turns", "共 8 回合，每回合在地图上选一个地点和一个行动"]]}, {"t": "loop", "steps": ["在地图上选地点", "选择行动", "精力 / 预算 / 碳排变化", "低碳选择攒生态点", "科技树永久升级"], "note": "8 回合结束后，按碳排、精力、预算三项综合评级，并进入全球排行榜。"}, {"t": "screens", "items": [{"tag": "生存游戏", "title": "回合决策", "wide": true, "imgs": [{"src": "media/eco-game.jpg", "alt": "生存游戏：卡尔顿山的行动选择"}], "points": ["顶部状态栏同时显示精力、预算、碳排、剩余回合和城市健康度", "地图上的地点都是留学生日常会去的：Lidl / Sainsbury's 超市、主图书馆、剧院、卡尔顿山", "到达地点后给出 2～3 个行动，每个都标出对精力、预算、碳排的影响，例如在卡尔顿山：自带午餐、路上买外卖、只是看风景", "高碳选项用红色卡片区分，但不禁用，选择权留给玩家"]}, {"tag": "生态科技树", "title": "Eco Tech Tree", "wide": true, "imgs": [{"src": "media/eco-tree.jpg", "alt": "生态科技树"}], "points": ["低碳选择获得生态点数，用来解锁「永久改变选项」的升级", "升级有前置关系：保温改造（取暖碳排 −20%）解锁太阳能板（每回合 +1 生态点）和社区合作社", "电单车订阅（骑行 +5 精力）解锁月票（公共交通费用 −40%）", "蔬菜盒订阅、堆肥（食物垃圾碳排 −30%）、碳追踪 App（选择前先看到准确碳排）", "把「一次性的好选择」变成「越玩越容易低碳」的长期激励"]}, {"tag": "结算", "title": "评级与排行榜", "wide": true, "imgs": [{"src": "media/eco-result.jpg", "alt": "结算页：A+ 与排行榜"}], "points": ["评级 A+「Sustainable Balance」，配五星和一句话总结：低碳、精力充沛、还有余钱", "三张卡片分别回顾碳排 6 kg、精力 100%、预算 £145", "排行榜按最低碳排排序，显示全球已玩 248 次和自己的名次", "另有「我的决策」回看每一步，以及分享入口，给用户再玩一次的理由"]}]}, {"t": "h", "text": "8　验证与迭代"}, {"t": "stats", "items": [{"n": "20+", "l": "名目标用户参与可用性测试"}, {"n": "有声思考法", "l": "记录用户每一步的决策理由"}]}, {"t": "p", "text": "根据测试中用户的决策理由，调优三种资源的消耗比例和交互路径，让「选低碳」既不是必然最优，也不是必然吃亏。"}, {"t": "h", "text": "9　商业延展：如果它是一款碳管理 SaaS"}, {"t": "table", "head": ["", "设想"], "rows": [["客户", "高校可持续发展办公室、国际学生服务部门；有 ESG 披露需求的企业（员工通勤与差旅）"], ["产品形态", "前台是城市情景和生存游戏，地图换成客户所在城市；后台是按 DEFRA 口径统计的匿名碳数据看板"], ["价值", "把难推动的行为改变变成参与式活动，同时产出可用于 Scope 3（通勤、差旅）核算的数据"], ["变现", "按席位年费订阅；新生入学季、地球日等挑战赛活动包；年度碳报告等数据增值服务"], ["关键指标", "参与率、低碳选择占比变化、季度留存"], ["风险", "数据准确性与「漂绿」质疑：沿用数据来源页的做法，公开口径和局限，只呈现可核查的结果"]]}], "cover": "media/eco-cover.jpg"}], "leadership": [{"org": "UIC AI 专业学会", "title": "骨干成员 · 竞赛统筹", "description": "负责数学建模、电子竞技大赛等校内外大型竞赛的全流程项目管理与活动统筹，协调多方资源，管理百人级参赛团队。"}], "papers": [{"title": "微调轻量级模型以实现高效的文本风格转换：Gemma 方法", "journal": "DCS-DS 海报大会", "date": "2024", "description": "NLP 项目，入选 2024 年 DCS-DS 海报大会，受邀出席并现场展示。"}], "patents": [], "awards": [{"name": "香洲区小品大赛银奖（学校历史最高荣誉）", "description": "作为核心演员参赛"}], "languages": [{"language": "英语", "level": "工作语言", "proficiency": "全英文授课硕士，可独立撰写英文需求文档与学术、商业报告"}], "itSkills": [{"name": "Figma"}, {"name": "墨刀"}, {"name": "XMind"}, {"name": "Claude / Copilot / Codex 辅助需求分析与原型迭代"}, {"name": "Python"}, {"name": "SQL"}, {"name": "Java"}, {"name": "C"}, {"name": "R"}, {"name": "定性与定量数据分析"}], "certificates": [], "summary": "具备 2 段产品实习与 3 个 0→1 产品项目经验，擅长用户调研、需求优先级判断、原型设计与可用性测试。实习中参与 G 端智慧城市 AI 安防产品与 AI 对话产品，运用 NLP 等 AI 能力从海量用户反馈中挖掘需求；独立完成电商、心理健康、可持续等方向的 C 端产品项目，以数据和用户反馈驱动产品迭代。"};
  const PERSONA = "你是莫晋睿的 AI 分身，代表他回答招聘方和访客的问题。语气真诚、具体、不浮夸；用第三人称称呼他（「晋睿」或「他」）。回答优先引用资料里的具体数字和做法（例如 10 万+ 条诉求、Kano 模型、30+ 个原型、202 份问卷、满意度提升 30%）。资料里没有的不要编造，直接说不确定，并建议发邮件联系。不要透露手机号。";
function localAnswer(pub, question) {
  const name = pub.name || '我';
  const q = question.toLowerCase().trim();
  const span = (a, b) => [a, b || '至今'].filter(Boolean).join('–');
  const cut = (t, n = 70) => { t = String(t || '').replace(/\s+/g, ' ').trim(); return t.length > n ? t.slice(0, n) + '…' : t; };
  const list = (items, fmt) => items.map((x, i) => `${i + 1}. ${fmt(x)}`).join('\n');
  const contact = pub.email ? `可以发邮件到 ${pub.email}` : '可以通过主页上的链接联系';
  const exp = [...pub.experience, ...pub.work];

  // 寒暄
  if (/^(你好|您好|hi|hello|嗨|哈喽|在吗|在不在)[!！。.?？\s]*$/i.test(q))
    return `你好！我是${name}的 AI 助手。你可以问我${name}做过的项目、实习经历、擅长的技能、教育背景，或者怎么联系。`;
  if (/^(谢谢|感谢|thanks|thank you|好的|ok|嗯)/i.test(q)) return `不客气～还想了解${name}哪方面，随时问我。`;

  // 具体某个项目 / 公司：问到名字就展开讲
  // 名字的任意一段（中文名、英文名、去掉后缀的简称）出现在问题里都算问到了
  const aliases = (n) => { const s = String(n || '').toLowerCase(); return [s, ...s.split(/[\s（）()·\-—]+/), s.replace(/(项目|平台|设计|系统|app)$/i, '')].map((x) => x.trim()).filter((x) => x.length >= 2); };
  const hitP = pub.projects.find((p) => p.name && aliases(p.name).some((a) => q.includes(a)));
  if (hitP) return `「${hitP.name}」${hitP.role ? `（${hitP.role}）` : ''}${hitP.tech ? `\n技术/工具：${hitP.tech}` : ''}\n${hitP.description || '暂无详细描述。'}`;
  const hitE = exp.find((e) => e.company && aliases(e.company.replace(/(股份|有限|科技|智能|公司|集团|广东省|北京|上海|杭州|深圳)/g, ' ')).concat(e.company.toLowerCase()).some((a) => q.includes(a)));
  if (hitE) return `${hitE.company} · ${hitE.title}（${span(hitE.startDate, hitE.endDate)}）\n${hitE.description || '暂无详细描述。'}`;

  const has = (re) => re.test(q);
  const allText = [...exp.map((e) => [e.company, e.description]), ...pub.projects.map((p) => [p.name, p.description])];
  // 问做法：优先级、调研、原型、测试……从经历原文里找对应的句子
  const METHOD = [[/优先级|排期|kano|四象限|判断需求|取舍/i, /优先级|kano|四象限|排期/i], [/调研|访谈|问卷|痛点|用户研究/, /调研|访谈|问卷|痛点|卡片分类/], [/原型|figma|墨刀|交互|信息架构/i, /原型|figma|墨刀|信息架构|交互/i], [/测试|验证|满意度|数据驱动|指标/, /可用性测试|有声思考|满意度|验收|误报/]];
  for (const [ask, find] of METHOD) {
    if (!ask.test(q)) continue;
    const hits = [];
    for (const [src, d] of allText) for (const line of String(d || '').split(/\n+/)) for (const s of line.replace(/^[^：:]{2,14}[：:]/, '').split(/[；;]/)) if (find.test(s) && hits.length < 3) hits.push(`· ${s.trim()}（${src}）`);
    if (hits.length) return `${name}的做法，摘几条原话：\n${hits.join('\n')}`;
  }
  if (has(/\bai\b|人工智能|大模型|nlp/i)) {
    const ai = [...exp.filter((e) => /\bai\b|nlp|算法|聊天机器人|机器学习|大模型/i.test(e.description || '')).map((e) => `${e.company}（${e.title}）：${cut(e.description.split('\n').find((l) => /\bai\b|nlp|算法|聊天机器人/i.test(l)) || e.description, 60)}`),
      ...pub.projects.filter((p) => /\bai\b|nlp|算法|聊天机器人|机器学习|大模型/i.test((p.description || '') + (p.tech || ''))).map((p) => `「${p.name}」：${cut(p.description.split('\n').find((l) => /\bai\b|nlp|算法|聊天机器人/i.test(l)) || p.description, 60)}`)];
    if (ai.length) return `和 AI 相关的经历：\n${list(ai, (x) => x)}`;
  }
  if (has(/项目|作品|做过|做了什么|portfolio|project/)) {
    if (!pub.projects.length) return `${name}的主页上暂时没有公开项目，${contact}了解更多。`;
    if (pub.projects.length === 1) { const p = pub.projects[0]; return `${name}做过「${p.name}」${p.role ? `（${p.role}）` : ''}：\n${p.description || ''}`; }
    return `${name}做过 ${pub.projects.length} 个项目：\n${list(pub.projects, (p) => `「${p.name}」${p.role ? `（${p.role}）` : ''}：${cut(p.description, 40)}`)}\n\n想详细了解哪个，直接问项目名就行。`;
  }
  if (has(/实习|工作|经历|公司|上班|experience|intern/)) {
    if (!exp.length) return `${name}的主页上暂时没有公开实习经历。`;
    return `${name}的经历：\n${list(exp, (e) => `${e.company} · ${e.title}（${span(e.startDate, e.endDate)}）${e.description ? '：' + cut(e.description, 50) : ''}`)}\n\n想展开哪一段，问公司名就行。`;
  }
  if (has(/学校|教育|学历|专业|毕业|读书|大学|硕士|本科|博士|school|education/)) {
    if (!pub.education.length) return `主页上没有公开教育经历。`;
    return list(pub.education, (e) => `${span(e.startDate, e.endDate)} ${e.school}${e.college ? ' ' + e.college : ''} · ${e.degree || ''} · ${e.major || ''}`);
  }
  if (has(/技能|技术|会什么|擅长|能力|语言|英语|编程|工具|证书|skill/)) {
    const parts = [
      pub.itSkills.length && `专业技能：${pub.itSkills.map((x) => x.name + (x.proficiency ? `（${x.proficiency}）` : '')).join('、')}`,
      pub.languages.length && `外语：${pub.languages.map((l) => [l.language, l.level, l.score].filter(Boolean).join(' ')).join('、')}`,
      pub.certificates.length && `证书：${pub.certificates.map((c) => c.name).join('、')}`,
    ].filter(Boolean);
    return parts.length ? parts.join('\n') : `主页上暂时没有公开技能信息。`;
  }
  if (has(/论文|发表|学术|研究|paper/) && pub.papers.length) return list(pub.papers, (x) => `《${x.title}》${[x.journal, x.level].filter(Boolean).join(' · ')}`);
  if (has(/奖|荣誉|获奖|奖学金|award/) && pub.awards.length) return list(pub.awards, (a) => `${a.date || ''} ${a.name}`);
  if (has(/社团|学生会|职务|干部|校园/) && pub.leadership.length) return list(pub.leadership, (l) => `${l.org} · ${l.title}${l.description ? '：' + cut(l.description, 50) : ''}`);
  if (has(/联系|邮箱|邮件|微信|电话|简历|contact|email/)) return `${contact}。`;
  if (has(/求职|意向|岗位|找工作|想做|方向|城市|base|offer/)) return `求职意向：${pub.intent.position || '暂未填写'}${pub.intent.city ? `\n期望城市：${pub.intent.city}` : ''}`;
  if (has(/介绍|是谁|简介|自己|关于|优势|特点|为什么|适合/)) return `${pub.headline ? pub.headline + '\n' : ''}${pub.bio || ''}${pub.summary ? '\n' + pub.summary : ''}`.trim() || `我是${name}的 AI 助手。`;

  let sampleP = null, aiOff = false;

  function board(st) {

    for (const n of notes) {
      const b = document.createElement('button');

    const pos = (n, x, y, w) => { n.x = x; n.y = y; n.el.style.transform = `translate(${x}px, ${y}px)`; n.el.style.width = w ? w + 'px' : ''; };
    let sorted = false;
    const W = () => el.clientWidth, H = () => el.clientHeight - 52;
    function scatter() {
      sorted = false; el.classList.remove('sorted'); el.style.height = '';
      const w = W(), h = H(), cols = Math.max(2, Math.round(Math.sqrt(notes.length * w / h))), rows = Math.ceil(notes.length / cols);
      const order = notes.map((n, i) => i).sort(() => Math.random() - .5);
      order.forEach((ni, k) => {
        const n = notes[ni];
        n.el.style.width = ''; n.el.classList.remove('wrapnote');
        const cw = w / cols, ch = h / rows, nw = n.el.offsetWidth, nh = n.el.offsetHeight;
        const cx = (k % cols) * cw, cy = Math.floor(k / cols) * ch;
        pos(n, Math.max(8, Math.min(w - nw - 8, cx + Math.random() * Math.max(4, cw - nw))), Math.max(14, Math.min(h - nh - 10, cy + 10 + Math.random() * Math.max(4, ch - nh - 10))));
        n.el.style.rotate = (Math.random() * 6 - 3).toFixed(1) + 'deg';
      });
      $('#sortBtn').textContent = '整理成方法';
      $('#boardHint').textContent = '这些是我简历里用到的方法。拖一拖，或者点「整理」。';
    }

      sorted = true; el.classList.add('sorted');
      const w = W(), cw = w / 4, top = Math.max(...$$('.cols b, .cols small', el).filter((x) => x.offsetParent).map((x) => x.offsetTop + x.offsetHeight)) + 10;

    $('#scrim').classList.remove('on');
    if (scrollY > innerHeight * .8) $('#fab').classList.add('on');
  }
  function addMsg(role, text) {
    const d = document.createElement('div');
    d.className = 'msg ' + (role === 'user' ? 'me' : 'bot');
    d.textContent = text;
    $('#msgs').append(d); $('#msgs').scrollTop = 1e9;
    return d;
  }
  function renderSugg(extra = []) {
    agent.follow = [...new Set([...extra, ...agent.follow])].filter((x) => !agent.asked.has(x));
    const list = [...new Set([...agent.follow.slice(0, 2), ...agent.suggestions])].filter((x) => !agent.asked.has(x)).slice(0, 4);
    $('#sugg').innerHTML = '';
    for (const s of list) { const b = document.createElement('button'); b.textContent = s; b.onclick = () => ask(s); $('#sugg').append(b); }
  }
  async function ask(q) {
    q = String(q || '').trim();
    if (!q || ask.busy) return;
    ask.busy = true; agent.asked.add(q);
    $('#sugg').innerHTML = ''; $('#askForm button').disabled = true;
    addMsg('user', q); agent.history.push({ role: 'user', content: q });
    const t = addMsg('bot', '正在想'); t.classList.add('typing');
    try {
      const d = { answer: await answer(q, (text) => { t.textContent = text; t.classList.remove('typing'); $('#msgs').scrollTop = 1e9; }) };
      t.textContent = d.answer; t.classList.remove('typing');
      agent.history.push({ role: 'assistant', content: d.answer });
      const pub = window.__pub || {}, follow = [];
      for (const x of pub.projects || []) if (x.name && d.answer.includes(x.name.split(/\s/)[0]) && !q.includes(x.name.split(/\s/)[0])) follow.push(`详细说说「${x.name}」`);
      for (const e of [...(pub.experience || []), ...(pub.work || [])]) if (e.company && d.answer.includes(e.company) && !q.includes(e.company)) follow.push(`在${e.company}具体做了什么？`);
      renderSugg(follow.slice(0, 2));
    } catch (e) {
      t.textContent = `没能拿到回答：${e.message}。可以稍后再试，或者直接发邮件。`; t.classList.remove('typing');
      renderSugg();
    } finally { ask.busy = false; $('#askForm button').disabled = false; $('#q').focus({ preventScroll: true }); }
  }

  document.addEventListener('click', (e) => {
    const a = e.target.closest('[data-ask]');
    if (a) { e.preventDefault(); openAgent(a.dataset.ask); return; }
    if (e.target.closest('[data-open-agent]')) openAgent();
  });
  $('#closeAgent').onclick = closeAgent;
  $('#scrim').onclick = closeAgent;
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && agent.open) closeAgent(); });
  $('#askForm').onsubmit = (e) => { e.preventDefault(); const q = $('#q').value; if (!q.trim() || ask.busy) return; $('#q').value = ''; ask(q); };

  (async () => {
    const p = DATA;
    window.__pub = p;
    document.title = `${p.name}${p.headline ? ' · ' + p.headline : ' · 个人主页'}`;
    const st = render(p);
    board(st);
    wire(st);
    $('#agentTitle').textContent = `${p.name}的 AI 分身`;
    addMsg('bot', p.welcome || `你好，我是${p.name}的 AI 分身。可以问我${p.name}的项目、经历、做事方法，或者求职意向。`);
    agent.suggestions = p.questions?.length ? p.questions : ['做过哪些项目？', '有什么实习经历？', '擅长什么？', '在哪里读书？', '求职意向是什么？', '怎么联系？'];
    renderSugg();
    if (/^#detail-/.test(location.hash)) route(); else if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
  })();
})();

</script>

</body></html>
